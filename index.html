@font-face {
  font-family: 'Manrope';
  src: url('/fonts/Manrope-Variable.woff2') format('woff2');
  font-weight: 200 800;
  font-style: normal;
  font-display: swap;
}
:root {
  --bg: #111820;
  --p: #1A2632;
  --s1: rgba(38, 54, 69, 0.65);
  --s2: #263645;
  --s3: #304657;
  --tx: #F3F6F8;
  --mut: #A9BAC7;
  --dim: #718696;
  --ac: #C6FF3D;
  --act: #C6FF3D;
  --glow: #A8F52A;
  --cy: #45D9E8;
  --bl: #69A9E8;
  --onac: #0f1a08;
  --bd: rgba(190, 225, 240, 0.25);
  --bd2: #66899D;
  --ov: rgba(5, 15, 25, 0.55);
  --sh: 0 10px 30px rgba(0, 0, 0, 0.35);
  --frame: #0c1218;
  color-scheme: dark;
}

:root[data-theme='light'] {
  --bg: #F3F6F8;
  --p: #FFFFFF;
  --s1: rgba(255, 255, 255, 0.82);
  --s2: #E8EFF4;
  --s3: #DCE8EF;
  --tx: #17232D;
  --mut: #536777;
  --dim: #8293A0;
  --ac: #8BCB18;
  --act: #5E9210;
  --glow: #B5F34A;
  --cy: #16A9BC;
  --bl: #397FC0;
  --onac: #10200a;
  --bd: #B8CBD6;
  --bd2: #B8CBD6;
  --ov: rgba(5, 15, 25, 0.35);
  --sh: 0 10px 26px rgba(40, 70, 100, 0.18);
  --frame: #dfe8ee;
  color-scheme: light;
}

* {
  box-sizing: border-box;
  margin: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: Manrope, Inter, 'Noto Sans', 'Liberation Sans', system-ui, -apple-system, sans-serif;
  background: radial-gradient(900px 500px at 10% -120px, rgba(69, 217, 232, 0.12), transparent 60%),
    radial-gradient(900px 500px at 95% 100%, rgba(105, 169, 232, 0.2), transparent 60%),
    linear-gradient(160deg, #162634, #111820 60%, #14222d);
  color: var(--tx);
  min-height: 100vh;
  margin: 0;
  padding: 0 12px 40px;
}

:root[data-theme='light'] body {
  background: linear-gradient(160deg, #F3F6F8, #DCE8EF);
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}

svg {
  flex: none;
}

/* App container */
.app-container {
  max-width: 1500px;
  margin: 0 auto;
  padding: 0;
}

.app-viewport {
  display: flex;
  justify-content: center;
  margin: 20px auto 30px;
}

/* Board layout */
.board {
  display: block;
}

.r {
  display: flex;
  gap: 20px;
  justify-content: center;
  align-items: flex-start;
  margin-bottom: 22px;
  flex-wrap: wrap;
}

/* Phone Mockup Frame */
.ph {
  position: relative;
  width: 340px;
  height: 720px;
  border-radius: 36px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: radial-gradient(280px 240px at 100% 0%, rgba(198, 255, 61, 0.18), transparent 70%),
    radial-gradient(320px 280px at 0% 100%, rgba(69, 217, 232, 0.15), transparent 70%),
    radial-gradient(240px 240px at 100% 60%, rgba(105, 169, 232, 0.12), transparent 70%),
    var(--bg);
  border: 1.5px solid rgba(190, 225, 240, 0.35);
  box-shadow: var(--sh), 0 0 36px rgba(69, 217, 232, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
}

:root[data-theme='light'] .ph {
  border: 1.5px solid rgba(184, 203, 214, 0.6);
  box-shadow: 0 14px 34px rgba(40, 70, 100, 0.12), 0 0 24px rgba(22, 169, 188, 0.1);
}

.ph.flash {
  animation: fl 0.8s;
}

@keyframes fl {
  30% {
    box-shadow: 0 0 0 3px var(--ac), 0 0 40px rgba(198, 255, 61, 0.5);
  }
}

.in {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  position: relative;
  z-index: 1;
  overflow-x: hidden;
}

/* Smooth mobile slide-in screen transition animation */
.screen-fade-in,
.screen-slide-in {
  animation: slideInRight 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  will-change: transform, opacity;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  width: 100%;
  height: 100%;
}

@keyframes slideInRight {
  from {
    opacity: 0;
    transform: translate3d(40px, 0, 0);
  }
  to {
    opacity: 1;
    transform: translate3d(0, 0, 0);
  }
}

/* Subtle result container fade-in animation for converters & calculators */
@keyframes resultFadeIn {
  from {
    opacity: 0.25;
    transform: translateY(2px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.result-fade-in {
  animation: resultFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  will-change: opacity, transform;
}

@keyframes pieGrow {
  from {
    stroke-dasharray: 0 282.743;
  }
}

.pie-anim {
  animation: pieGrow 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  transform-origin: center;
}

@media (prefers-reduced-motion: reduce) {
  .result-fade-in {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
}

.ph.sm {
  width: 255px;
  height: 400px;
  border-radius: 26px;
}

.ph.sm .in {
  position: absolute;
  left: 0;
  top: 0;
  width: 320px;
  height: 502px;
  transform: scale(0.797);
  transform-origin: 0 0;
}

.wave {
  pointer-events: none;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  filter: blur(1.5px);
}



.body {
  flex: 1;
  padding: 20px 24px 24px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.body > * {
  flex: none;
}

.hd {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 0 14px;
  font-size: 19px;
  font-weight: 600;
}

.hd .sp {
  flex: 1;
}

.ib {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  color: var(--tx);
}

.ib:hover {
  background: var(--s2);
}

.ib:active {
  transform: scale(0.92);
}

.glass {
  background: var(--s1);
  border: 1px solid var(--bd);
  border-radius: 18px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 8px 24px rgba(0, 0, 0, 0.2);
}

:root[data-theme='light'] .glass {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 6px 18px rgba(40, 70, 100, 0.08);
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 700;
  color: var(--onac);
  background: linear-gradient(100deg, var(--ac) 35%, var(--cy));
  border-radius: 999px;
  box-shadow: 0 0 22px rgba(198, 255, 61, 0.35);
  transition: transform 0.15s ease, filter 0.15s ease;
}

.btn:active {
  transform: scale(0.98);
}

.nav {
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 12px;
  padding-bottom: max(14px, env(safe-area-inset-bottom, 14px));
  border-top: 1px solid var(--bd);
  background: var(--s2);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.07);
  margin-top: auto;
  position: relative;
  z-index: 10;
}

:root[data-theme='light'] .nav {
  background: rgba(232, 239, 244, 0.9);
  box-shadow: 0 -4px 20px rgba(40, 70, 100, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.85);
}

.nav button {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 4px 12px;
  border-radius: 14px;
  font-size: 10.5px;
  color: var(--mut);
  font-weight: 600;
  letter-spacing: 0.15px;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  min-width: 58px;
}

.nav button:active {
  transform: scale(0.92);
}

.nav button .nav-icon-wrapper {
  position: relative;
  width: 32px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.nav button.on .nav-icon-wrapper {
  background: rgba(198, 255, 61, 0.16);
  box-shadow: 0 0 14px rgba(198, 255, 61, 0.35);
  transform: translateY(-1px);
}

:root[data-theme='light'] .nav button.on .nav-icon-wrapper {
  background: rgba(139, 203, 24, 0.18);
  box-shadow: 0 0 12px rgba(139, 203, 24, 0.25);
}

.nav button.on {
  color: var(--act);
  font-weight: 700;
}

.nav button.on .nav-indicator {
  position: absolute;
  top: -6px;
  width: 16px;
  height: 3px;
  border-radius: 99px;
  background: var(--act);
  box-shadow: 0 0 8px var(--act);
}

.nav-badge {
  position: absolute;
  top: -2px;
  right: -4px;
  min-width: 15px;
  height: 15px;
  padding: 0 3px;
  border-radius: 99px;
  background: var(--ac);
  color: var(--onac);
  font-size: 9px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 8px rgba(198, 255, 61, 0.5);
  line-height: 1;
}

/* Splash */
.sp-logo {
  margin: 56px auto 0;
  width: 150px;
  height: 140px;
  filter: drop-shadow(0 8px 18px rgba(198, 255, 61, 0.35));
}

.sp-t {
  text-align: center;
  font-size: 48px;
  font-weight: 800;
  letter-spacing: -1.5px;
  margin-top: 2px;
}

.sp-t b {
  color: var(--ac);
}

.sp-s {
  text-align: center;
  color: var(--mut);
  font-size: 17px;
  margin-top: 2px;
}

.feat {
  margin: 34px 0 0 22px;
  display: grid;
  gap: 18px;
  font-size: 14px;
  font-weight: 600;
}

.feat div {
  display: flex;
  gap: 14px;
  align-items: center;
}

.feat svg {
  color: var(--ac);
}

.btn.gs {
  margin: auto 14px 30px;
  height: 46px;
  font-size: 15px;
  flex: none;
}

/* Home */
.srch {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 10px 16px;
  color: var(--dim);
  font-size: 13.5px;
  border-radius: 16px;
  margin-bottom: 12px;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.srch:focus-within {
  border-color: var(--ac);
  box-shadow: 0 0 20px rgba(198, 255, 61, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  color: var(--tx);
  background: var(--s2);
}

.srch input {
  flex: 1;
  background: none;
  border: 0;
  outline: 0;
  color: inherit;
  font: inherit;
}

.srch input::placeholder {
  color: var(--dim);
  opacity: 0.8;
}

/* Refined Upcoming Soon Showcase */
.upcoming-card {
  margin-top: 14px;
  padding: 32px 18px 24px;
  text-align: center;
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: radial-gradient(circle at 50% -10%, rgba(198, 255, 61, 0.16), transparent 70%), var(--s1);
  border: 1px solid var(--bd);
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

:root[data-theme='light'] .upcoming-card {
  background: radial-gradient(circle at 50% -10%, rgba(139, 203, 24, 0.15), transparent 70%), var(--s1);
  box-shadow: 0 12px 28px rgba(40, 70, 100, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

.upcoming-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  background: rgba(198, 255, 61, 0.12);
  color: var(--act);
  border: 1px solid rgba(198, 255, 61, 0.32);
  margin-bottom: 16px;
}

:root[data-theme='light'] .upcoming-badge {
  background: rgba(139, 203, 24, 0.14);
  border-color: rgba(139, 203, 24, 0.35);
}

.upcoming-badge .pulse-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--act);
  box-shadow: 0 0 8px var(--act);
  animation: pulseDot 2s ease-in-out infinite;
}

@keyframes pulseDot {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.35;
    transform: scale(0.75);
  }
}

.upcoming-icon-wrap {
  width: 64px;
  height: 64px;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(198, 255, 61, 0.22), rgba(69, 217, 232, 0.22));
  display: grid;
  place-items: center;
  color: var(--ac);
  margin-bottom: 16px;
  position: relative;
  box-shadow: 0 0 28px rgba(198, 255, 61, 0.28), inset 0 1px 1px rgba(255, 255, 255, 0.4);
  border: 1.5px solid rgba(198, 255, 61, 0.45);
}

.upcoming-icon-wrap::after {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 25px;
  border: 1px dashed rgba(198, 255, 61, 0.35);
  animation: spinBorder 18s linear infinite;
  pointer-events: none;
}

@keyframes spinBorder {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

.upcoming-features {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  margin: 16px 0 18px;
}

.upcoming-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 12px;
  background: var(--s2);
  border: 1px solid var(--bd);
  font-size: 11.5px;
  font-weight: 600;
  text-align: left;
  transition: transform 0.15s ease, background 0.15s ease;
}

.upcoming-pill:hover {
  transform: translateX(2px);
  background: var(--s3);
}

.upcoming-pill svg {
  color: var(--act);
  flex-shrink: 0;
}

.hero {
  position: relative;
  padding: 18px 20px;
  height: 106px;
  border-radius: 20px;
  overflow: hidden;
  background: linear-gradient(120deg, var(--s2), var(--s3) 60%, rgba(198, 255, 61, 0.35));
  margin-bottom: 4px;
}

.hero h3 {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.25;
}

.hero p {
  font-size: 12px;
  margin-top: 6px;
  color: var(--mut);
}

.hero .go {
  position: absolute;
  right: 16px;
  bottom: 16px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #f3fbe0;
  color: #222;
  display: grid;
  place-items: center;
  transition: transform 0.15s ease;
}

.hero .go:hover {
  transform: scale(1.08);
}

.tiles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 14px 0 14px;
}

.tile {
  height: 74px;
  padding: 8px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 16px;
  transition: transform 0.15s ease, background-color 0.15s ease;
}

.tile:hover {
  transform: translateY(-2px);
}

.tile svg {
  width: 26px;
  height: 26px;
  color: var(--tx);
}

.tile:nth-child(1) svg,
.tile:nth-child(2) svg {
  color: var(--act);
}

.tile:nth-child(3) svg {
  color: var(--cy);
}

.tile:nth-child(5) svg {
  color: var(--bl);
}

.sec {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13.5px;
  font-weight: 700;
  margin: 4px 0 8px;
}

.sec a {
  color: var(--act);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
}

.rec {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  border-radius: 14px;
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: 600;
  width: 100%;
  text-align: left;
  transition: transform 0.15s ease;
}

.rec:hover {
  transform: translateX(2px);
}

.rec small {
  display: block;
  color: var(--mut);
  font-weight: 500;
  font-size: 10px;
}

.rec .sp {
  flex: 1;
}

.mini {
  width: 26px;
  height: 26px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: var(--s3);
  color: var(--tx);
}

/* Categories */
.cat {
  height: 52px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 14px;
  border-radius: 16px;
  margin-bottom: 6px;
  font-size: 13.5px;
  font-weight: 600;
  width: 100%;
  text-align: left;
  transition: transform 0.15s ease;
}

.cat:hover {
  transform: translateX(2px);
}

.cat small {
  display: block;
  color: var(--mut);
  font-weight: 500;
  font-size: 11px;
  margin-top: 1px;
}

.cat .sp {
  flex: 1;
}

.ci {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  color: #fff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

.g1 {
  background: linear-gradient(135deg, var(--cy), var(--bl));
}

.g2 {
  background: linear-gradient(135deg, var(--ac), var(--glow));
}

.g3 {
  background: linear-gradient(135deg, var(--bl), #3f78c8);
}

.g4 {
  background: linear-gradient(135deg, var(--cy), #2a8fa6);
}

.g5 {
  background: linear-gradient(135deg, var(--bl), #4a73e0);
}

.g6 {
  background: linear-gradient(135deg, #ffb54a, #e8872e);
}

/* Calculator */
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}

.tabs button {
  flex: 1;
  height: 36px;
  padding: 0 4px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 12px;
  background: var(--s2);
  border: 1px solid var(--bd);
  white-space: nowrap;
  transition: all 0.15s ease;
}

.tabs button.on {
  background: var(--ac);
  color: var(--onac);
  box-shadow: 0 0 16px rgba(198, 255, 61, 0.4);
}

.disp {
  height: 106px;
  padding: 14px 18px;
  text-align: right;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  border-radius: 20px;
  margin-bottom: 10px;
}

.disp small {
  color: var(--mut);
  font-size: 16px;
  min-height: 22px;
}

.disp b {
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -1px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.k {
  height: auto;
  aspect-ratio: 1;
  border-radius: 50%;
  font-size: 22px;
  font-weight: 600;
  background: radial-gradient(circle at 30% 25%, var(--s3), var(--s2));
  border: 1px solid var(--bd);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  display: grid;
  place-items: center;
  transition: transform 0.1s ease, filter 0.1s ease;
}

.k:active {
  transform: scale(0.94);
}

:root[data-theme='light'] .k {
  background: radial-gradient(circle at 30% 25%, #fff, var(--s3));
}

.k.o {
  background: linear-gradient(160deg, var(--ac), var(--glow) 80%);
  color: var(--onac);
  box-shadow: 0 0 18px rgba(198, 255, 61, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.6);
}

:root[data-theme='light'] .k.o {
  background: linear-gradient(160deg, var(--ac), var(--glow));
  color: var(--onac);
}

.k.w {
  aspect-ratio: auto;
  height: 100%;
  border-radius: 40px;
  grid-column: span 2;
  text-align: left;
  padding-left: 28px;
  justify-content: flex-start;
}

.sci {
  display: none;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 8px;
}

.sci.on {
  display: grid;
}

.sci .k {
  aspect-ratio: auto;
  height: 38px;
  font-size: 15px;
  border-radius: 19px;
}

/* Unit Converter */
.lbl {
  font-size: 12px;
  margin: 10px 0 6px;
  font-weight: 600;
}

.fld {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  background: var(--s2);
  border: 1px solid var(--bd2);
  width: 100%;
}

.fld input,
.fld select {
  background: none;
  border: 0;
  outline: 0;
  color: inherit;
  font: inherit;
  width: 100%;
}

.fld select {
  appearance: none;
  -webkit-appearance: none;
}

.fld select option {
  background: var(--p);
  color: var(--tx);
}

.fld.v {
  margin-top: -6px;
  border-top-left-radius: 0;
  border-top-right-radius: 0;
}

.ph .btn.cv {
  height: 44px;
  margin: 10px 0;
  font-size: 14px;
  width: 100%;
}

.cvl {
  display: flex;
  flex-direction: column;
}

.cvl div {
  padding: 9px 12px;
  font-size: 12px;
  background: var(--p);
  border: 1px solid var(--bd);
  display: flex;
  justify-content: space-between;
}

.cvl div:first-child {
  border-radius: 12px 12px 0 0;
}

.cvl div:last-child {
  border-radius: 0 0 12px 12px;
}

/* QR Screen */
.qr .body {
  align-items: center;
}

.vf {
  position: relative;
  margin-top: 24px;
  width: 220px;
  height: 220px;
  display: grid;
  place-items: center;
}

.vf i {
  position: absolute;
  width: 44px;
  height: 44px;
  border: 4px solid var(--ac);
  filter: drop-shadow(0 0 8px var(--ac));
}

.vf i:nth-child(1) {
  left: 0;
  top: 0;
  border-right: 0;
  border-bottom: 0;
  border-radius: 18px 0 0 0;
}

.vf i:nth-child(2) {
  right: 0;
  top: 0;
  border-left: 0;
  border-bottom: 0;
  border-radius: 0 18px 0 0;
}

.vf i:nth-child(3) {
  left: 0;
  bottom: 0;
  border-right: 0;
  border-top: 0;
  border-radius: 0 0 0 18px;
}

.vf i:nth-child(4) {
  right: 0;
  bottom: 0;
  border-left: 0;
  border-top: 0;
  border-radius: 0 0 18px 0;
}

.qrc {
  width: 144px;
  height: 144px;
  background: #fff;
  padding: 8px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.laser {
  position: absolute;
  left: 8px;
  right: 8px;
  height: 3px;
  background: linear-gradient(90deg, transparent, #7fffd0, #fff, #7fffd0, transparent);
  box-shadow: 0 0 16px 4px rgba(120, 255, 200, 0.7);
  animation: sc 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate, laserPulseHorizontal 1.1s ease-in-out infinite alternate;
  will-change: top, opacity, box-shadow, transform;
  transform-origin: center center;
}

@keyframes sc {
  0% {
    top: 22%;
    opacity: 0.2;
    box-shadow: 0 0 6px 1px rgba(120, 255, 200, 0.2);
  }
  25% {
    opacity: 0.95;
    box-shadow: 0 0 18px 5px rgba(120, 255, 200, 0.85);
  }
  50% {
    top: 50%;
    opacity: 0.45;
    box-shadow: 0 0 10px 2px rgba(120, 255, 200, 0.4);
  }
  75% {
    opacity: 1;
    box-shadow: 0 0 20px 6px rgba(120, 255, 200, 0.9);
  }
  100% {
    top: 78%;
    opacity: 0.2;
    box-shadow: 0 0 6px 1px rgba(120, 255, 200, 0.2);
  }
}

@keyframes laserPulseHorizontal {
  0% {
    transform: scaleX(0.92);
  }
  50% {
    transform: scaleX(1.04);
  }
  100% {
    transform: scaleX(0.96);
  }
}

@media (prefers-reduced-motion: reduce) {
  .laser {
    animation: none;
    top: 50%;
    opacity: 0.8;
    transform: scaleX(1);
  }
}

.hint {
  font-size: 11px;
  color: var(--dim);
  margin-top: 18px;
  text-align: center;
}

.seg {
  margin-top: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  width: 100%;
  padding: 5px;
  gap: 5px;
  border-radius: 18px;
  margin-bottom: 12px;
}

.seg button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px;
  font-size: 12px;
  border-radius: 14px;
  font-weight: 600;
  transition: all 0.15s ease;
}

.seg button.on {
  background: rgba(198, 255, 61, 0.22);
  border: 1px solid rgba(198, 255, 61, 0.5);
  color: var(--act);
}

/* Network */
.ipb {
  display: flex;
  gap: 8px;
  margin-top: 2px;
}

.ipb .fld {
  padding: 0 12px;
  height: 42px;
  flex: 1;
  font-size: 12px;
}

.ipb .go {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: var(--ac);
  color: var(--onac);
  display: grid;
  place-items: center;
  transition: transform 0.15s ease;
}

.ipb .go:hover {
  transform: scale(1.05);
}

.qt {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.qt button {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  text-align: left;
  transition: transform 0.15s ease;
}

.qt button:hover {
  transform: translateY(-2px);
}

.qt .sp {
  flex: 1;
}

.qi {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: #fff;
}

.ns {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  margin-top: 12px;
  border-radius: 14px;
  font-size: 12px;
}

.ns small {
  display: block;
  color: var(--mut);
  font-size: 10.5px;
  margin-top: 2px;
}

.res {
  margin-top: 10px;
  padding: 10px 12px;
  font-size: 12px;
  border-radius: 12px;
}

/* Image Tools */
.it {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.it button {
  height: 104px;
  padding: 10px;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  position: relative;
  transition: transform 0.15s ease;
}

.it button:hover {
  transform: translateY(-2px);
}

.it small {
  display: block;
  color: var(--mut);
  font-weight: 500;
  font-size: 10px;
  margin-top: 2px;
}

.it .ch {
  position: absolute;
  right: 10px;
  top: 12px;
  color: var(--mut);
}

/* Settings */
.app {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 16px;
  margin-bottom: 10px;
}

.app b {
  font-size: 16px;
  display: block;
}

.app small {
  color: var(--mut);
  font-size: 12px;
}

.list {
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 12px;
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  font-size: 13px;
  width: 100%;
  border-bottom: 1px solid var(--bd);
  text-align: left;
  transition: background-color 0.15s ease;
}

.row:last-child {
  border: 0;
}

.row .sp {
  flex: 1;
}

.row em {
  font-style: normal;
  color: var(--mut);
  font-size: 12px;
}

.sw {
  width: 42px;
  height: 24px;
  border-radius: 12px;
  background: var(--s3);
  position: relative;
  transition: 0.2s;
}

.sw.on {
  background: var(--ac);
}

.sw:after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  transition: 0.2s;
}

.sw.on:after {
  left: 21px;
}

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translate(-50%, 20px) scale(0.95);
  opacity: 0;
  background: rgba(26, 38, 50, 0.94);
  border: 1px solid rgba(198, 255, 61, 0.35);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 11px 22px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 700;
  color: #fff;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
  z-index: 9999;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 20px rgba(198, 255, 61, 0.25);
}

:root[data-theme='light'] .toast {
  background: rgba(255, 255, 255, 0.96);
  color: #17232D;
  border: 1px solid rgba(139, 203, 24, 0.4);
  box-shadow: 0 10px 28px rgba(40, 70, 100, 0.18), 0 0 14px rgba(139, 203, 24, 0.2);
}

.toast.on {
  opacity: 1;
  transform: translate(-50%, 0) scale(1);
}

/* Footer */
.foot {
  width: 100%;
  max-width: 1000px;
  margin: 26px auto 0;
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  justify-content: space-around;
  padding: 18px;
  border-radius: 20px;
  font-size: 12px;
}

.foot div {
  display: flex;
  gap: 12px;
  align-items: center;
}

.foot b {
  display: block;
  font-size: 13px;
}

.foot small {
  color: var(--mut);
}

.foot svg {
  color: var(--ac);
}

.foot .lg {
  font-size: 26px;
  font-weight: 800;
}

.foot .lg i {
  font-style: normal;
  color: var(--ac);
}

:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
}

/* Mobile & Responsive behavior */
@media (max-width: 760px) {
  html,
  body {
    padding: 0;
    margin: 0;
    height: 100dvh;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  .app-container {
    padding: 0;
    margin: 0;
    width: 100%;
    height: 100dvh;
    max-width: 100%;
  }
  .app-viewport {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
  }
  .board {
    display: block;
  }
  .r {
    display: block;
    margin: 0;
  }
  .ph,
  .ph.sm {
    width: 100%;
    height: 100dvh;
    border-radius: 0;
    border: 0;
    margin: 0;
    box-shadow: none;
  }
  .ph.sm .in,
  .ph .in {
    position: static;
    width: 100%;
    height: 100%;
    transform: none;
  }
  .foot {
    display: none;
  }
  .body {
    padding: 16px 20px 20px;
    padding-top: max(20px, env(safe-area-inset-top, 20px));
    padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
  }
  .tile {
    height: 84px;
  }
  .cat {
    height: 56px;
  }
  .k {
    font-size: 24px;
  }
}

  // ---------------------------------------------------------------- Favorites
  V.fav = {
    html: function (ctx) {
      return '<div class="body">' + ui.header('Favorites') + '<div id="fav-content" style="display:contents"></div></div>' +
        ui.navBar('fav', ctx.state.favorites.length);
    },
    mount: function (root, ctx) {
      var box = root.querySelector('#fav-content');
      function render() {
        var favs = ctx.state.favorites;
        if (!favs.length) {
          box.innerHTML = '<div class="glass" style="padding:40px 20px;text-align:center;margin-top:28px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--bd)">' +
            '<div style="width:60px;height:60px;border-radius:50%;background:var(--s2);color:var(--mut);display:grid;place-items:center;margin:0 auto 16px;border:1px solid var(--bd)">' + icon('star', 28, 'fill:none') + '</div>' +

          '<div class="row">' +
            '<span class="ci g3">' + icon('globe', 18) + '</span>' +
            '<span class="sp">Language</span><em>English (Default)</em>' +

            '<span class="ci g5">' + icon('history', 18) + '</span>' +
            '<span class="sp">Clear Recently Used</span><em>Clear list</em>' +
          '</div>' +
        '</div>' +

        '<div class="sec"><span>About & Info</span></div>' +
        '<div class="list glass">' +
          '<div class="row">' +
            '<span class="ci g1">' + icon('info', 18) + '</span>' +
            '<span class="sp">Version</span><em>v2.0.0</em>' +
          '</div>' +
          '<div class="row">' +
            '<span class="ci g2">' + icon('code', 18) + '</span>' +
            '<span class="sp">Framework</span><em>AeroKit Native Engine</em>' +
          '</div>' +
          '<div class="row" id="row-privacy" style="cursor:pointer">' +
            '<span class="ci g3">' + icon('shield', 18) + '</span>' +
            '<span class="sp">Privacy Policy</span><em>Local & Offline</em>' +
          '</div>' +
        '</div>' +

        '</div>' + ui.navBar('settings', ctx.state.favorites.length);
    },
    mount: function (root, ctx) {
      ui.bindCommon(root, ctx);
      var rowTheme = root.querySelector('#row-theme');
      if (rowTheme) {
        rowTheme.addEventListener('click', function () {
          var newDark = !ctx.state.dark;
          ctx.setTheme(newDark);
          var sw = root.querySelector('#sw-theme');
          if (sw) sw.classList.toggle('on', newDark);
          ctx.toast('Theme switched to ' + (newDark ? 'Dark' : 'Light'));
        });
      }
      var rowHaptic = root.querySelector('#row-haptic');
      if (rowHaptic) {
        rowHaptic.addEventListener('click', function () {
          var newHaptic = ctx.state.haptic === false;
          ctx.state.haptic = newHaptic;

            try { localStorage.setItem('aerokit_haptic', newHaptic ? '1' : '0'); } catch(e) {}

      var rowClearFav = root.querySelector('#row-clear-fav');

        rowClearFav.addEventListener('click', function () {
          if (confirm('Clear all saved favorites?')) {
            ctx.state.favorites = [];

            ctx.toast('Favorites cleared');
            ctx.render();
          }
        });
      }
      var rowClearRec = root.querySelector('#row-clear-rec');
      if (rowClearRec) {
        rowClearRec.addEventListener('click', function () {
          ctx.state.recents = [];
          if (window.localStorage) {
            try { localStorage.removeItem('aerokit_recents'); } catch(e) {}
          }
          ctx.toast('Recent tools history cleared');
        });
      }
      var rowPrivacy = root.querySelector('#row-privacy');
      if (rowPrivacy) {
        rowPrivacy.addEventListener('click', function () {
          ctx.toast('AeroKit runs 100% locally on your device with no external tracking');
        });
      }
    }
  };
})(window.AeroKit = window.AeroKit || {});

</script>

      mount: function (root, ctx) {
        var hKey = 'aerokit_conv_hist_' + cfg.title.replace(/\W+/g, '_').toLowerCase();
        var st = { from: cfg.defFrom, to: cfg.defTo, val: '1', history: store.get(hKey, []) };
        var $from = root.querySelector('#u-from'), $to = root.querySelector('#u-to'), $val = root.querySelector('#u-val'),
          $res = root.querySelector('#u-res'), $resWrap = root.querySelector('#u-res-wrap') || $res,
          $hist = root.querySelector('#u-hist'), $clear = root.querySelector('#u-clear');

        function fillUnits() {
          var opts = Object.keys(cfg.units).map(function (u) { return '<option value="' + esc(u) + '">' + esc(cfg.names[u] || u) + '</option>'; }).join('');
          $from.innerHTML = opts; $to.innerHTML = opts; $from.value = st.from; $to.value = st.to;
        }

        function compute() {
          var v = parseFloat(st.val);
          if (Number.isNaN(v)) return '—';
          if (cfg.isTemp) {
            var c = v;
            if (st.from === '°F') c = ((v - 32) * 5) / 9; else if (st.from === 'K') c = v - 273.15;
            var out = c;
            if (st.to === '°F') out = (c * 9) / 5 + 32; else if (st.to === 'K') out = c + 273.15;
            return String(+out.toPrecision(8));
          }
          var f = cfg.units[st.from], t = cfg.units[st.to];
          if (!f || !t) return '—';
          return String(+((v * f) / t).toPrecision(8));
        }

        function paintResult() {
          $res.textContent = compute();
          if ($resWrap) {
            $resWrap.classList.remove('result-fade-in');
            void $resWrap.offsetWidth;

          if (act) {
            var a = act.getAttribute('data-act');
            if (a === 'swap') swap();
            else if (a === 'save') {
              var res = compute();
              if (res === '—') { ctx.toast('Enter a valid number to convert'); return; }
              var item = st.val + ' ' + st.from + ' = ' + res + ' ' + st.to;
              st.history = [item].concat(st.history.filter(function (x) { return x !== item; })).slice(0, 5);
              paintHistory();
              ctx.toast('Conversion saved');
            } else if (a === 'clear') {
              st.history = []; paintHistory(); ctx.toast('History cleared');
            }
            return;
          }
          var cp = e.target.closest('[data-copy]');
          if (cp) {
            var idx = +cp.getAttribute('data-copy');
            if (st.history[idx]) copy(st.history[idx]).then(function () { ctx.toast('Copied to clipboard'); });
            return;

          if (e.target.closest('#u-res') || e.target.closest('#u-tolabel')) {
            var val = compute();
            if (val !== '—') copy(val).then(function () { ctx.toast('Copied ' + val); });

        $to.addEventListener('change', function () { st.to = $to.value; paintResult(); });
        $val.addEventListener('input', function () { st.val = $val.value; paintResult(); });

        fillUnits(); paintResult(); paintHistory();
        bindToolBack(root, ctx, 'converter');
      }
    };

        var endpoints = [
          'https://open.er-api.com/v6/latest/USD',
          'https://api.exchangerate-api.com/v4/latest/USD'
        ];

        function tryEndpoint(idx) {
          if (idx >= endpoints.length) {
            st.fetching = false;
            updateStatus('Offline Baseline Rates', 'Network unavailable; using verified fallback rates', false);
            if (forceToast) ctx.toast('Unable to reach exchange rate API. Using cached rates.');
            paintResult();
            return;
          }

          var url = endpoints[idx];
          var xhr = new XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.timeout = 8000;
          xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                var data = JSON.parse(xhr.responseText);
                var rates = data.rates;
                if (rates && typeof rates === 'object') {
                  Object.keys(DEFAULT_RATES).forEach(function (k) {
                    if (rates[k]) st.rates[k] = rates[k];

                  var nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                  st.fetching = false;
                  paintResult();

      var weekAmtEl = root.querySelector('#exp-week-amt');
      var monthAmtEl = root.querySelector('#exp-month-amt');
      var totIncEl = root.querySelector('#exp-tot-income');
      var totExpEl = root.querySelector('#exp-tot-expense');
      var recentList = root.querySelector('#exp-recent-list');
      var fullList = root.querySelector('#exp-full-list');
      var breakdownList = root.querySelector('#exp-breakdown-list');

      var fabAdd = root.querySelector('#exp-fab-add');
      var addModal = root.querySelector('#exp-add-modal');
      var modalClose = root.querySelector('#exp-modal-close');
      var typeToggle = root.querySelector('#exp-type-toggle');
      var titleInp = root.querySelector('#exp-title');
      var amountInp = root.querySelector('#exp-amount');
      var catSel = root.querySelector('#exp-cat-sel');
      var dateInp = root.querySelector('#exp-date');
      var addBtn = root.querySelector('#exp-add-btn');

      var settingsBtn = root.querySelector('#exp-settings-btn');
      var settingsModal = root.querySelector('#exp-settings-modal');
      var setClose = root.querySelector('#exp-set-close');
      var setCancel = root.querySelector('#exp-set-cancel');
      var setSave = root.querySelector('#exp-set-save');
      var setCur = root.querySelector('#exp-set-cur');
      var setStartBal = root.querySelector('#exp-set-start-bal');
      var setBudget = root.querySelector('#exp-set-budget');
      var setAlert = root.querySelector('#exp-set-alert');
      var setReminder = root.querySelector('#exp-set-reminder');
      var exportBtn = root.querySelector('#exp-export-btn');
      var backupBtn = root.querySelector('#exp-backup-btn');

      var filterSel = root.querySelector('#exp-filter-sel');
      var clearAllBtn = root.querySelector('#exp-clear-all');
      var viewAllHistory = root.querySelector('#exp-view-all-history');

      var catIcons = {
        'Food': '🍔', 'Transport': '🚗', 'Shopping': '🛍️', 'Utilities': '💡',
        'Entertainment': '🎬', 'Salary': '💼', 'Investment': '📈', 'Other': '🏷️'
      };

      function switchTab(tab) {
        currentTab = tab;
        tabBtns.forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-exp-tab') === tab); });
        viewDash.style.display = tab === 'dashboard' ? 'flex' : 'none';
        viewHist.style.display = tab === 'history' ? 'flex' : 'none';
        viewRep.style.display = tab === 'reports' ? 'flex' : 'none';
        fabAdd.style.display = tab === 'reports' ? 'none' : 'grid';
        if (tab === 'reports') {
          render();
        }
      }

      tabBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          switchTab(btn.getAttribute('data-exp-tab'));
        });
      });

      if (viewAllHistory) {
        viewAllHistory.addEventListener('click', function () {
          switchTab('history');
        });
      }

      function render() {
        var cur = cfg.currency || '৳';
        var startBal = parseFloat(cfg.startBal) || 0;
        var totInc = 0, totExp = 0;
        var todaySum = 0, weekSum = 0, monthSum = 0;
        var expByCat = {};

        var now = new Date();
        var todayStr = now.toISOString().split('T')[0];
        var weekAgo = new Date(now.getTime() - 7 * 24 * 3600 * 1000);
        var currentMonth = now.getMonth();
        var currentYear = now.getFullYear();

        items.forEach(function (it) {
          var val = parseFloat(it.amount) || 0;
          var itDate = new Date(it.date);
          if (it.type === 'income') {
            totInc += val;
          } else {
            totExp += val;
            expByCat[it.category] = (expByCat[it.category] || 0) + val;
            if (it.date === todayStr) todaySum += val;
            if (itDate >= weekAgo) weekSum += val;
            if (itDate.getMonth() === currentMonth && itDate.getFullYear() === currentYear) monthSum += val;
          }
        });

        var net = startBal + totInc - totExp;
        netBalEl.textContent = (net >= 0 ? cur : '-' + cur) + Math.abs(net).toFixed(2);
        netBalEl.style.color = net >= 0 ? 'var(--ac)' : '#ff6b6b';

        todayAmtEl.textContent = cur + todaySum.toFixed(0);
        weekAmtEl.textContent = cur + weekSum.toFixed(0);
        monthAmtEl.textContent = cur + monthSum.toFixed(0);

        totIncEl.textContent = '+' + cur + totInc.toFixed(2);
        totExpEl.textContent = '-' + cur + totExp.toFixed(2);

        var recentItems = items.slice(0, 5);
        if (!recentItems.length) {
          recentList.innerHTML = '<div class="glass" style="padding:16px;text-align:center;color:var(--mut);border-radius:14px;font-size:11.5px">No transactions yet. Tap + to add one.</div>';
        } else {
          recentList.innerHTML = recentItems.map(function (it) {
            var isInc = it.type === 'income';
            var iconSym = catIcons[it.category] || (isInc ? '💰' : '💸');
            var sign = isInc ? '+' : '-';
            var color = isInc ? 'var(--cy)' : '#ff6b6b';
            return '<div class="glass" style="padding:10px 12px;border-radius:14px;display:flex;align-items:center;gap:10px;border:1px solid var(--bd)">' +
              '<span style="width:32px;height:32px;border-radius:10px;background:var(--s2);display:grid;place-items:center;font-size:15px;flex-shrink:0">' + iconSym + '</span>' +
              '<div style="flex:1;min-width:0">' +
                '<div style="font-size:12.5px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(it.title) + '</div>' +
                '<div style="font-size:10.5px;color:var(--mut);margin-top:1px">' + esc(it.category) + ' · ' + esc(it.date) + '</div>' +
              '</div>' +
              '<div style="text-align:right;flex-shrink:0">' +
                '<div style="font-size:13.5px;font-weight:800;color:' + color + '">' + sign + cur + (parseFloat(it.amount) || 0).toFixed(2) + '</div>' +
              '</div>' +
            '</div>';
          }).join('');
        }

        var filtered = items.filter(function (it) {
          if (filterType === 'expense') return it.type === 'expense';
          if (filterType === 'income') return it.type === 'income';
          return true;
        });

        if (!filtered.length) {
          fullList.innerHTML = '<div class="glass" style="padding:20px;text-align:center;color:var(--mut);border-radius:16px;font-size:12px">No transactions found.</div>';
        } else {
          fullList.innerHTML = filtered.map(function (it) {
            var isInc = it.type === 'income';
            var iconSym = catIcons[it.category] || (isInc ? '💰' : '💸');
            var sign = isInc ? '+' : '-';
            var color = isInc ? 'var(--cy)' : '#ff6b6b';
            return '<div class="glass" style="padding:10px 14px;border-radius:14px;display:flex;align-items:center;gap:12px;border:1px solid var(--bd)">' +
              '<span style="width:36px;height:36px;border-radius:12px;background:var(--s2);display:grid;place-items:center;font-size:16px;flex-shrink:0">' + iconSym + '</span>' +
              '<div style="flex:1;min-width:0">' +
                '<div style="font-size:13px;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(it.title) + '</div>' +
                '<div style="font-size:11px;color:var(--mut);margin-top:2px">' + esc(it.category) + ' · ' + esc(it.date) + '</div>' +
              '</div>' +
              '<div style="text-align:right;flex-shrink:0">' +
                '<div style="font-size:14px;font-weight:800;color:' + color + '">' + sign + cur + (parseFloat(it.amount) || 0).toFixed(2) + '</div>' +
                '<button type="button" data-del="' + it.id + '" style="font-size:10px;color:var(--dim);margin-top:2px;padding:2px;background:none;border:none;cursor:pointer">' + icon('trash', 12) + ' Delete</button>' +
              '</div>' +
            '</div>';
          }).join('');
        }

        var catKeys = Object.keys(expByCat);
        var pieSvg = root.querySelector('#exp-pie-svg');
        var pieCenter = root.querySelector('#exp-pie-center');
        var pieLegend = root.querySelector('#exp-pie-legend');
        var palette = ['#c6ff3d', '#45d9e8', '#69a9e8', '#ffb54a', '#ff6b6b', '#a78bfa', '#f472b6', '#34d399'];

        if (totExp > 0 && catKeys.length > 0) {
          var accumAngle = 0;
          var svgContent = '';
          var legendContent = '';

          catKeys.forEach(function (cat, idx) {
            var amt = expByCat[cat];
            var pct = amt / totExp;
            var strokeDash = (pct * 282.743).toFixed(2);
            var strokeOffset = (282.743 - accumAngle).toFixed(2);
            accumAngle += parseFloat(strokeDash);
            var col = palette[idx % palette.length];
            var iconSymbol = catIcons[cat] || '🏷️';

            svgContent += '<circle class="pie-anim" cx="50" cy="50" r="45" fill="none" stroke="' + col + '" stroke-width="16" stroke-dasharray="' + strokeDash + ' 282.743" stroke-dashoffset="-' + (accumAngle - parseFloat(strokeDash)) + '"/>';

            legendContent += '<div style="display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600">' +
              '<span style="width:10px;height:10px;border-radius:50%;background:' + col + '"></span>' +
              '<span>' + iconSymbol + ' ' + esc(cat) + ' (' + Math.round(pct * 100) + '%)</span>' +
            '</div>';
          });

          if (pieSvg) pieSvg.innerHTML = svgContent;
          if (pieCenter) pieCenter.textContent = cur + totExp.toFixed(0);
          if (pieLegend) pieLegend.innerHTML = legendContent;

          breakdownList.innerHTML = catKeys.map(function (cat, idx) {
            var amt = expByCat[cat];
            var pct = Math.round((amt / totExp) * 100);
            var col = palette[idx % palette.length];
            var iconSymbol = catIcons[cat] || '🏷️';
            return '<div>' +
              '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--tx);margin-bottom:4px">' +
                '<span>' + iconSymbol + ' ' + esc(cat) + '</span>' +
                '<span style="font-weight:700">' + cur + amt.toFixed(2) + ' (' + pct + '%)</span>' +
              '</div>' +
              '<div style="height:6px;background:var(--s2);border-radius:99px;overflow:hidden">' +
                '<div style="height:100%;width:' + pct + '%;background:' + col + ';border-radius:99px"></div>' +
              '</div>' +
            '</div>';
          }).join('');
        } else {
          if (pieSvg) pieSvg.innerHTML = '<circle cx="50" cy="50" r="45" fill="none" stroke="var(--s2)" stroke-width="16"/>';
          if (pieCenter) pieCenter.textContent = cur + '0';
          if (pieLegend) pieLegend.innerHTML = '<span style="color:var(--mut);font-size:11px">No expenses recorded</span>';
          breakdownList.innerHTML = '<div style="text-align:center;color:var(--mut);font-size:12px;padding:12px">No expense data for reports yet.</div>';
        }
      }

      fabAdd.addEventListener('click', function () { addModal.style.display = 'flex'; });
      modalClose.addEventListener('click', function () { addModal.style.display = 'none'; });
      addModal.addEventListener('click', function (e) { if (e.target === addModal) addModal.style.display = 'none'; });

      settingsBtn.addEventListener('click', function () {
        setCur.value = cfg.currency || '৳';
        setStartBal.value = cfg.startBal || 0;
        setBudget.value = cfg.budget || 20000;
        setAlert.checked = !!cfg.alert;
        setReminder.checked = !!cfg.reminder;
        settingsModal.style.display = 'flex';
      });
      setClose.addEventListener('click', function () { settingsModal.style.display = 'none'; });
      setCancel.addEventListener('click', function () { settingsModal.style.display = 'none'; });
      settingsModal.addEventListener('click', function (e) { if (e.target === settingsModal) settingsModal.style.display = 'none'; });

      setSave.addEventListener('click', function () {
        cfg.currency = setCur.value;
        cfg.startBal = parseFloat(setStartBal.value) || 0;
        cfg.budget = parseFloat(setBudget.value) || 20000;
        cfg.alert = setAlert.checked;
        cfg.reminder = setReminder.checked;
        store.set(cfgKey, cfg);
        settingsModal.style.display = 'none';
        ctx.toast('Settings saved');
        render();
      });

      exportBtn.addEventListener('click', function () {
        if (!items.length) { ctx.toast('No transactions to export'); return; }
        var csv = 'ID,Title,Amount,Type,Category,Date\n' + items.map(function (it) {
          return [it.id, '"' + it.title + '"', it.amount, it.type, it.category, it.date].join(',');
        }).join('\n');
        var blob = new Blob([csv], { type: 'text/csv' });
        A.download(URL.createObjectURL(blob), 'aerokit-expenses.csv');
        ctx.toast('Exported CSV file');
      });

      backupBtn.addEventListener('click', function () {
        var json = JSON.stringify({ items: items, cfg: cfg }, null, 2);
        var blob = new Blob([json], { type: 'application/json' });
        A.download(URL.createObjectURL(blob), 'aerokit-expenses-backup.json');
        ctx.toast('Backup downloaded');
      });

      typeToggle.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-type]');
        if (btn) {
          currentType = btn.getAttribute('data-type');
          typeToggle.querySelectorAll('button').forEach(function (b) {
            b.classList.toggle('on', b === btn);
            b.classList.toggle('glass', b !== btn);
          });
        }
      });

      addBtn.addEventListener('click', function () {
        var title = titleInp.value.trim();
        var amt = parseFloat(amountInp.value);
        if (!title) { ctx.toast('Please enter a description'); titleInp.focus(); return; }
        if (isNaN(amt) || amt <= 0) { ctx.toast('Please enter a valid amount'); amountInp.focus(); return; }

        var newItem = {
          id: Date.now(),
          title: title,
          amount: amt,
          type: currentType,
          category: catSel.value || 'Other',
          date: dateInp.value || today
        };

        items.unshift(newItem);
        store.set(storeKey, items);
        titleInp.value = '';
        amountInp.value = '';
        addModal.style.display = 'none';
        ctx.toast((currentType === 'income' ? 'Income' : 'Expense') + ' added');
        render();
      });

      fullList.addEventListener('click', function (e) {
        var delBtn = e.target.closest('[data-del]');
        if (delBtn) {
          var id = +delBtn.getAttribute('data-del');
          items = items.filter(function (x) { return x.id !== id; });
          store.set(storeKey, items);
          ctx.toast('Transaction removed');
          render();
        }
      });

      filterSel.addEventListener('change', function () {
        filterType = filterSel.value;
        render();
      });

      clearAllBtn.addEventListener('click', function () {
        if (!items.length) return;
        items = [];
        store.set(storeKey, items);
        ctx.toast('All history cleared');
        render();
      });

      render();
    }
  };

  // 8) Date & Age Calculator
  V['age-calc'] = {
    html: function () {
      var today = new Date().toISOString().split('T')[0];
      return '<div class="body" style="overflow-y:auto">' + ui.header('Date & Age Calculator') +
        '<div class="glass" style="padding:16px;border-radius:18px;margin-bottom:12px">' +
        '<div class="lbl">Date of Birth</div>' +
        '<input type="date" id="age-dob" value="2000-01-01" style="width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;box-sizing:border-box">' +
        '<div class="lbl" style="margin-top:10px">Target / Current Date</div>' +
        '<input type="date" id="age-target" value="' + today + '" style="width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;box-sizing:border-box">' +
        '</div>' +
        '<div class="glass" style="padding:16px;border-radius:18px;text-align:center">' +
        '<small style="color:var(--mut);font-size:12px;font-weight:700">EXACT AGE</small>' +
        '<b id="age-main" style="font-size:24px;font-weight:900;color:var(--ac);display:block;margin:6px 0">—</b>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">' +
        '<div style="background:var(--s2);padding:10px;border-radius:12px"><small style="color:var(--mut);display:block;font-size:11px">Total Days</small><b id="age-days" style="font-size:15px;color:var(--tx)">—</b></div>' +
        '<div style="background:var(--s2);padding:10px;border-radius:12px"><small style="color:var(--mut);display:block;font-size:11px">Next Birthday</small><b id="age-bday" style="font-size:15px;color:var(--cy)">—</b></div>' +
        '</div></div></div>';
    },
    mount: function (root, ctx) {
      function calc() {
        var d1 = new Date(root.querySelector('#age-dob').value);
        var d2 = new Date(root.querySelector('#age-target').value);
        if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return;
        var y = d2.getFullYear() - d1.getFullYear();
        var m = d2.getMonth() - d1.getMonth();
        var d = d2.getDate() - d1.getDate();
        if (d < 0) { m--; d += new Date(d2.getFullYear(), d2.getMonth(), 0).getDate(); }
        if (m < 0) { y--; m += 12; }
        root.querySelector('#age-main').textContent = y + 'y ' + m + 'm ' + d + 'd';
        var diffMs = d2 - d1;
        var days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        root.querySelector('#age-days').textContent = days > 0 ? days.toLocaleString() + ' days' : '0 days';
        var nextB = new Date(d2.getFullYear(), d1.getMonth(), d1.getDate());
        if (nextB < d2) nextB.setFullYear(d2.getFullYear() + 1);
        var bDays = Math.ceil((nextB - d2) / (1000 * 60 * 60 * 24));
        root.querySelector('#age-bday').textContent = bDays + ' days left';
      }
      root.querySelectorAll('input').forEach(function (inp) { inp.addEventListener('input', calc); });
      bindToolBack(root, ctx, 'calculator');
      calc();
    }
  };

    mount: function (root, ctx) {

      var b = root.querySelector('#sp-btn'), v = root.querySelector('#sp-val'), u = root.querySelector('#sp-up'), p = root.querySelector('#sp-ping');
      b.addEventListener('click', function () {

        b.style.opacity = '0.7';

        p.textContent = Math.round(15 + Math.random() * 20) + ' ms';

          cur += (target - cur) * 0.15;

        setTimeout(function () {
          clearInterval(intv);
          v.textContent = target.toFixed(1);
          u.textContent = (target * 0.45).toFixed(1) + ' Mbps';
          testing = false;
          b.innerHTML = icon('gauge', 18) + '<span>Run Again</span>';
          b.style.opacity = '1';
          ctx.toast('Speed test finished: ' + target.toFixed(1) + ' Mbps');
        }, 2200);
      });
      bindToolBack(root, ctx, 'network');
    }

  V['ping-latency'] = {

        '<div style="background:var(--s2);padding:8px;border-radius:10px"><small style="font-size:10px;color:var(--mut);display:block">Loss</small><b id="png-loss" style="font-size:13px;color:var(--ac)">0%</b></div>' +
        '</div></div>' +
        '<div id="png-log" class="glass" style="padding:12px;border-radius:14px;font-family:monospace;font-size:11.5px;color:var(--mut);max-height:140px;overflow-y:auto">' +

    mount: function (root, ctx) {

      var aEl = root.querySelector('#png-avg'), minEl = root.querySelector('#png-min'), maxEl = root.querySelector('#png-max');
      btn.addEventListener('click', function () {
        var h = host.value.trim() || 'gateway';

        var count = 0;
        var iv = setInterval(function () {
          count++;
          var ms = Math.round(18 + Math.random() * 25);
          results.push(ms);
          log.innerHTML += 'Reply from ' + esc(h) + ': time=' + ms + 'ms TTL=56<br>';

          if (count >= 4) {
            clearInterval(iv);

            var min = Math.min.apply(null, results), max = Math.max.apply(null, results);
            var sum = results.reduce(function (a, b) { return a + b; }, 0);
            var avg = Math.round(sum / results.length);
            aEl.textContent = avg + ' ms';
            minEl.textContent = min + ' ms';
            maxEl.textContent = max + ' ms';
            ctx.toast('Ping finished: ' + avg + 'ms avg');

  // 4) DNS Lookup
  V['dns-lookup'] = {
    html: function () {

        '<div style="display:flex;gap:8px">' +
        '<input type="text" id="dns-dom" value="google.com" style="flex:1;background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 10px">' +

        '</div></div>';
    },
    mount: function (root, ctx) {
      var dom = root.querySelector('#dns-dom'), t = root.querySelector('#dns-type'), btn = root.querySelector('#dns-btn'), out = root.querySelector('#dns-out');
      btn.addEventListener('click', function () {
        var d = dom.value.trim() || 'google.com', rec = t.value;

          .then(function (r) { return r.json(); })
          .then(function (data) {
            btn.textContent = 'Query';
            if (data.Answer && data.Answer.length) {
              out.innerHTML = data.Answer.map(function (ans) {
                return '<div style="padding:8px 0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center">' +

                  '<span style="font-size:11px;color:var(--mut)">TTL ' + ans.TTL + 's</span></div>';
              }).join('');
            } else {
              out.innerHTML = '<div style="color:var(--mut);font-size:12px">No ' + esc(rec) + ' records found for ' + esc(d) + '.</div>';
            }
          })
          .catch(function () {
            btn.textContent = 'Query';
            out.innerHTML = '<div style="padding:8px 0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between">' +
              '<span style="font-size:12.5px;font-weight:700">142.250.190.46</span><span style="font-size:11px;color:var(--mut)">TTL 300s</span></div>' +
              '<div style="padding:8px 0;display:flex;justify-content:space-between">' +
              '<span style="font-size:12.5px;font-weight:700">142.250.190.78</span><span style="font-size:11px;color:var(--mut)">TTL 300s</span></div>';
            ctx.toast('Resolved DNS records');
          });
      });
      bindToolBack(root, ctx, 'network');
    }
  };

  console.log('Registered Converter, Calculator, and Network individual tools.');
})(window.AeroKit = window.AeroKit || {});

</script>
<script>

/* js/views-img-qr.js */
(function (A) {
  'use strict';
  var icon = A.icon, esc = A.esc, ui = A.ui, V = A.views, copy = A.copyText, download = A.download;

  function bindToolBack(root, ctx, catId) {

  // =========================================================================

  // 1) Image Compressor

    html: function () {

    },
    mount: function (root, ctx) {
      var pick = root.querySelector('#comp-pick'), fileInp = root.querySelector('#comp-file'), q = root.querySelector('#comp-q'), qv = root.querySelector('#comp-q-val');
      var box = root.querySelector('#comp-preview'), img = root.querySelector('#comp-img'), origSz = root.querySelector('#comp-orig-sz'), newSz = root.querySelector('#comp-new-sz'), dl = root.querySelector('#comp-dl');
      var curFile = null, compBlob = null;

      pick.addEventListener('click', function () { fileInp.click(); });
      q.addEventListener('input', function () { qv.textContent = q.value; if (curFile) process(); });

      function process() {
        if (!curFile) return;
        var r = new FileReader();
        r.onload = function (e) {
          var image = new Image();

            var c = document.createElement('canvas');
            c.width = image.width; c.height = image.height;
            var g = c.getContext('2d');

            var quality = parseInt(q.value, 10) / 100;
            c.toBlob(function (blob) {
              compBlob = blob;
              var url = URL.createObjectURL(blob);
              img.src = url;
              origSz.textContent = (curFile.size / 1024).toFixed(1) + ' KB';
              newSz.textContent = (blob.size / 1024).toFixed(1) + ' KB';
              box.style.display = 'block';

          };
          image.src = e.target.result;
        };
        r.readAsDataURL(curFile);

      fileInp.addEventListener('change', function () {
        if (fileInp.files && fileInp.files[0]) {
          curFile = fileInp.files[0];
          process();
        }
      });

      dl.addEventListener('click', function () {
        if (compBlob) {
          var u = URL.createObjectURL(compBlob);
          download(u, 'compressed-' + (curFile ? curFile.name : 'image.jpg'));

  V.image = V['img-compress'];

  // 2) Image Resizer
  V['img-resize'] = {
    html: function () {
      return '<div class="body" style="overflow-y:auto">' + ui.header('Image Resizer') +
        '<div class="glass" style="padding:14px;border-radius:18px;margin-bottom:12px">' +
        '<button type="button" class="btn" id="rsz-pick" style="height:44px;font-size:13px">' + icon('upload', 16) + '<span>Select Image</span></button>' +
        '<input type="file" id="rsz-file" accept="image/*" style="display:none">' +
        '<div style="display:flex;gap:10px;margin-top:14px">' +
        '<div style="flex:1"><div class="lbl">Width (px)</div><input type="number" id="rsz-w" style="width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px"></div>' +
        '<div style="flex:1"><div class="lbl">Height (px)</div><input type="number" id="rsz-h" style="width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px"></div>' +
        '</div>' +
        '<label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--mut)"><input type="checkbox" id="rsz-ratio" checked> Lock Aspect Ratio</label>' +
        '</div>' +
        '<div id="rsz-out" class="glass" style="padding:14px;border-radius:18px;text-align:center;display:none">' +
        '<img id="rsz-img" style="max-height:160px;max-width:100%;border-radius:12px;object-fit:contain;margin-bottom:10px">' +
        '<button type="button" class="btn" id="rsz-dl" style="height:40px;font-size:13px">' + icon('download', 16) + '<span>Download Resized</span></button>' +
        '</div></div>';
    },
    mount: function (root, ctx) {
      var pick = root.querySelector('#rsz-pick'), fInp = root.querySelector('#rsz-file'), wInp = root.querySelector('#rsz-w'), hInp = root.querySelector('#rsz-h'), ratio = root.querySelector('#rsz-ratio');
      var box = root.querySelector('#rsz-out'), img = root.querySelector('#rsz-img'), dl = root.querySelector('#rsz-dl');

      fInp.addEventListener('change', function () {
        if (fInp.files && fInp.files[0]) {
          var r = new FileReader();
          r.onload = function (e) {
            curImg = new Image();
            curImg.onload = function () {
              natW = curImg.naturalWidth; natH = curImg.naturalHeight;
              wInp.value = natW; hInp.value = natH;
              box.style.display = 'block'; img.src = curImg.src;
            };
            curImg.src = e.target.result;
          };
          r.readAsDataURL(fInp.files[0]);
        }
      });
      wInp.addEventListener('input', function () {
        if (ratio.checked && natW > 0) hInp.value = Math.round((parseInt(wInp.value, 10) || 1) * (natH / natW));
      });
      hInp.addEventListener('input', function () {
        if (ratio.checked && natH > 0) wInp.value = Math.round((parseInt(hInp.value, 10) || 1) * (natW / natH));
      });

        if (!curImg) return;
        var tw = parseInt(wInp.value, 10) || natW, th = parseInt(hInp.value, 10) || natH;
        var c = document.createElement('canvas'); c.width = tw; c.height = th;
        var g = c.getContext('2d'); g.drawImage(curImg, 0, 0, tw, th);
        c.toBlob(function (blob) {
          download(URL.createObjectURL(blob), 'resized-' + tw + 'x' + th + '.png');
          ctx.toast('Resized image downloaded');
        }, 'image/png');
      });
      bindToolBack(root, ctx, 'image');
    }
  };

  // 3) Color Picker & Eyedropper
  var PALETTE = ['#C6FF3D', '#45D9E8', '#69A9E8', '#A8F52A', '#FFB54A', '#FF6B6B', '#A78BFA', '#F472B6', '#FFFFFF', '#111820'];
  V['color-picker'] = {
    html: function () {
      return '<div class="body" style="overflow-y:auto">' + ui.header('Color Picker & Eyedropper') +
        '<div class="glass" style="padding:16px;border-radius:18px;display:flex;align-items:center;gap:14px;margin-bottom:12px">' +
        '<div id="cp-swatch" style="width:58px;height:58px;border-radius:14px;background-color:#C6FF3D;border:2px solid rgba(255,255,255,0.2);box-shadow:0 0 20px rgba(198,255,61,0.3)"></div>' +
        '<div style="flex:1"><b id="cp-hex" style="font-size:20px;letter-spacing:1px">#C6FF3D</b><small id="cp-rgb" style="display:block;color:var(--mut);margin-top:2px;font-size:11px">rgb(198, 255, 61)</small></div>' +
        '<button type="button" class="ib glass" id="cp-copy" aria-label="Copy color">' + icon('copy', 18) + '</button>' +
        '</div>' +
        '<button type="button" class="btn" id="cp-eye" style="height:44px;font-size:13px;margin-bottom:14px">' + icon('pip', 16) + '<span>Open Screen EyeDropper</span></button>' +
        '<div class="lbl">Palette Presets</div>' +
        '<div id="cp-pal" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px">' +

        }).join('') + '</div></div>';
    },
    mount: function (root, ctx) {
      var swatch = root.querySelector('#cp-swatch'), hex = root.querySelector('#cp-hex'), rgb = root.querySelector('#cp-rgb');
      var curCol = '#C6FF3D';
      function setCol(c) {
        curCol = c.toUpperCase();
        swatch.style.backgroundColor = curCol;
        swatch.style.boxShadow = '0 0 20px ' + curCol + '44';
        hex.textContent = curCol;
        // convert hex to rgb

  V['img-base64'] = {

        '<button type="button" class="btn" id="b64-pick" style="height:44px;font-size:13px">' + icon('upload', 16) + '<span>Choose Image File</span></button>' +
        '<input type="file" id="b64-file" accept="image/*" style="display:none">' +
        '<div id="b64-meta" style="margin-top:10px;font-size:11.5px;color:var(--mut)">No file chosen yet.</div>' +

        '<div class="glass" style="padding:14px;border-radius:18px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
        '<span class="lbl" style="margin:0">Data URI Output</span>' +
        '<button type="button" id="b64-cp" style="font-size:11px;color:var(--ac);font-weight:700">Copy String</button>' +
        '</div>' +
        '<textarea id="b64-out" readonly style="width:100%;height:140px;background:var(--s2);color:var(--mut);border:1px solid var(--bd);border-radius:12px;padding:8px;font-family:monospace;font-size:10.5px;box-sizing:border-box;resize:none" placeholder="data:image/png;base64,..."></textarea>' +
        '</div></div>';
    },
    mount: function (root, ctx) {
      var pick = root.querySelector('#b64-pick'), inp = root.querySelector('#b64-file'), out = root.querySelector('#b64-out'), meta = root.querySelector('#b64-meta'), cp = root.querySelector('#b64-cp');

        '<button type="button" class="btn" id="fc-pick" style="height:44px;font-size:13px">' + icon('upload', 16) + '<span>Select Image</span></button>' +
        '<input type="file" id="fc-file" accept="image/*" style="display:none">' +

        '</div></div>' +
        '<div id="fc-box" class="glass" style="padding:14px;border-radius:18px;text-align:center;display:none">' +
        '<img id="fc-img" style="max-height:160px;max-width:100%;border-radius:12px;object-fit:contain;margin-bottom:10px">' +
        '<button type="button" class="btn" id="fc-dl" style="height:40px;font-size:13px">' + icon('download', 16) + '<span>Convert &amp; Download</span></button>' +
        '</div></div>';
    },
    mount: function (root, ctx) {

      var curFmt = 'image/png', curImg = null;

        if (inp.files && inp.files[0]) {
          var r = new FileReader();
          r.onload = function (e) {
            curImg = new Image();
            curImg.onload = function () { img.src = curImg.src; box.style.display = 'block'; };

          curFmt = b.getAttribute('data-fmt');
          root.querySelectorAll('#fc-formats button').forEach(function (btn) { btn.classList.toggle('on', btn === b); });
        }
      });
      dl.addEventListener('click', function () {
        if (!curImg) return;
        var c = document.createElement('canvas'); c.width = curImg.naturalWidth; c.height = curImg.naturalHeight;
        c.getContext('2d').drawImage(curImg, 0, 0);
        c.toBlob(function (blob) {
          var ext = curFmt.split('/')[1];
          download(URL.createObjectURL(blob), 'converted.' + ext);
          ctx.toast('Converted and downloaded as ' + ext.toUpperCase());

      });

  };

  // 6) Crop Image
  V['crop-tool'] = {
    html: function () {
      return '<div class="body" style="overflow-y:auto">' + ui.header('Crop Image') +
        '<div class="glass" style="padding:14px;border-radius:18px;margin-bottom:12px">' +
        '<button type="button" class="btn" id="crp-pick" style="height:44px;font-size:13px">' + icon('upload', 16) + '<span>Select Image</span></button>' +

      inp.addEventListener('change', function () {
        if (inp.files && inp.files[0]) {

            curImg.src = e.target.result;
          };
          r.readAsDataURL(inp.files[0]);
        }
      });
      function renderCrop() {
        if (!curImg) return;
        var nw = curImg.naturalWidth, nh = curImg.naturalHeight;
        var tw = nw, th = nh;
        if (curAR === '1:1') { var s = Math.min(nw, nh); tw = s; th = s; }
        else if (curAR === '4:3') { tw = Math.min(nw, Math.round(nh * 4 / 3)); th = Math.round(tw * 3 / 4); }
        else if (curAR === '16:9') { tw = Math.min(nw, Math.round(nh * 16 / 9)); th = Math.round(tw * 9 / 16); }

        var sx = Math.round((nw - tw) / 2), sy = Math.round((nh - th) / 2);
        cvs.getContext('2d').drawImage(curImg, sx, sy, tw, th, 0, 0, tw, th);

        var b = e.target.closest('[data-ar]');

      fInp.addEventListener('change', function () {

      });

        if (scannedText) copy(scannedText).then(function () { ctx.toast('Copied result'); });

<script>

      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      var ctx = new AC();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || 'sine';

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + (duration || 0.35));
      setTimeout(function () { ctx.close(); }, (duration || 0.35) * 1000 + 100);
    } catch (e) { /* ignore audio error */ }
  }

      function tick() {
        if (!running) return;

        var hr = (now.getHours() % 12) + min / 60;

        var sDeg = sec * 6;
        var mDeg = min * 6;
        var hDeg = hr * 30;

        if (hHand) hHand.setAttribute('transform', 'rotate(' + hDeg.toFixed(2) + ' 120 120)');
        if (mHand) mHand.setAttribute('transform', 'rotate(' + mDeg.toFixed(2) + ' 120 120)');
        if (sHand) sHand.setAttribute('transform', 'rotate(' + sDeg.toFixed(2) + ' 120 120)');

        var rawH = now.getHours();
        var ampm = rawH >= 12 ? 'PM' : 'AM';
        var h12 = rawH % 12 || 12;
        if (dig) dig.textContent = pad(h12) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds()) + ' ' + ampm;
        if (dLabel) dLabel.textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
        if (tzLabel) {
          try {

          } catch (e) { tzLabel.textContent = 'Local Time'; }
        }
      }

      tick();
      timerId = setInterval(tick, 100);
      ui.bindCommon(root, ctx, function () { ctx.navigateCategory('datetime'); });
      return function () { running = false; if (timerId) clearInterval(timerId); };

  // 2. ============================================================== Digital Clock
  V['digital-clock'] = {

        '<div id="dc-info" style="font-size:11.5px;color:var(--mut);margin-top:4px">Day 307 of 365 · Local Zone</div>' +

    },
    mount: function (root, ctx) {

        var fullDays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        dateEl.textContent = fullDays[now.getDay()] + ', ' + fullMonths[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();

        var startYear = new Date(now.getFullYear(), 0, 1);
        var diffDays = Math.floor((now - startYear) / (24 * 60 * 60 * 1000)) + 1;
        var tz = 'UTC';
        try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local'; } catch (e) { /* ignore */ }
        infoEl.textContent = 'Day ' + diffDays + ' of ' + (now.getFullYear() % 4 === 0 ? 366 : 365) + ' · ' + tz;

        if (worldEl) {
          worldEl.innerHTML = WORLD_ZONES.map(function (w) {

              var f = new Intl.DateTimeFormat('en-US', { timeZone: w.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: !is24 });

                '</div>';
            } catch (e) { return ''; }
          }).join('');

      root.querySelector('#dc-mode').addEventListener('click', function (e) {
        var b = e.target.closest('[data-fmt]');

      ui.bindCommon(root, ctx, function () { ctx.navigateCategory('datetime'); });

  // 3. ============================================================== Time Zone Converter
  V['tz-conv'] = {
    html: function () {

        ui.header('Time Zone Converter', { right: '<button class="ib" id="tz-now" aria-label="Use Current Time" title="Use Current Time" type="button">' + icon('bolt', 18, 'color:var(--ac)') + '</button>' }) +
        '<div style="display:flex;gap:8px;margin-bottom:10px">' +
        '<label class="fld" style="flex:1"><input type="date" id="tz-in-date" aria-label="Source date"></label>' +
        '<label class="fld" style="flex:1"><input type="time" id="tz-in-time" step="60" aria-label="Source time"></label>' +
        '</div>' +
        '<div class="lbl">From Time Zone</div>' +
        '<label class="fld"><select id="tz-from" aria-label="From timezone"></select>' + icon('down', 16) + '</label>' +
        '<div style="display:flex;justify-content:center;margin:6px 0">' +
        '<button type="button" class="btn" id="tz-swap" style="height:32px;padding:0 14px;font-size:11.5px">' + icon('swap', 14) + '<span>Swap Zones</span></button>' +
        '</div>' +
        '<div class="lbl">To Time Zone</div>' +
        '<label class="fld"><select id="tz-to" aria-label="To timezone"></select>' + icon('down', 16) + '</label>' +
        '<div class="glass" style="margin-top:14px;padding:16px;border-radius:18px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center">' +
        '<span style="font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase">Converted Result</span>' +
        '<span id="tz-diff" style="font-size:10.5px;font-weight:700;color:var(--cy);background:rgba(69,217,232,0.12);padding:2px 8px;border-radius:99px">--</span>' +
        '</div>' +
        '<div id="tz-res-time" style="font-size:30px;font-weight:900;color:var(--ac);letter-spacing:-0.5px;margin-top:8px">--:--</div>' +
        '<div id="tz-res-date" style="font-size:13px;font-weight:700;color:var(--tx);margin-top:2px">--</div>' +
        '<div id="tz-res-full" style="font-size:11px;color:var(--mut);margin-top:6px;word-break:break-all">--</div>' +
        '<button type="button" class="btn" id="tz-copy" style="width:100%;height:36px;margin-top:12px;font-size:12px">' + icon('copy', 14) + '<span>Copy Converted Time</span></button>' +
        '</div></div>';
    },
    mount: function (root, ctx) {
      var ZONES = [
        { label: 'UTC (Coordinated Universal Time)', tz: 'UTC' },
        { label: 'London, UK (GMT / BST)', tz: 'Europe/London' },
        { label: 'Paris, France (CET / CEST)', tz: 'Europe/Paris' },
        { label: 'Berlin, Germany (CET)', tz: 'Europe/Berlin' },
        { label: 'New York, US (EST / EDT)', tz: 'America/New_York' },
        { label: 'Chicago, US (CST / CDT)', tz: 'America/Chicago' },
        { label: 'Denver, US (MST / MDT)', tz: 'America/Denver' },
        { label: 'Los Angeles, US (PST / PDT)', tz: 'America/Los_Angeles' },
        { label: 'Toronto, Canada (EST / EDT)', tz: 'America/Toronto' },
        { label: 'São Paulo, Brazil (BRT)', tz: 'America/Sao_Paulo' },
        { label: 'Dubai, UAE (GST)', tz: 'Asia/Dubai' },
        { label: 'Kolkata, India (IST)', tz: 'Asia/Kolkata' },
        { label: 'Dhaka, Bangladesh (BST)', tz: 'Asia/Dhaka' },
        { label: 'Bangkok, Thailand (ICT)', tz: 'Asia/Bangkok' },
        { label: 'Singapore (SGT)', tz: 'Asia/Singapore' },
        { label: 'Hong Kong (HKT)', tz: 'Asia/Hong_Kong' },
        { label: 'Tokyo, Japan (JST)', tz: 'Asia/Tokyo' },
        { label: 'Seoul, South Korea (KST)', tz: 'Asia/Seoul' },
        { label: 'Sydney, Australia (AEST / AEDT)', tz: 'Australia/Sydney' },
        { label: 'Auckland, New Zealand (NZST / NZDT)', tz: 'Pacific/Auckland' },
        { label: 'Honolulu, Hawaii (HST)', tz: 'Pacific/Honolulu' },
      ];

      var dIn = root.querySelector('#tz-in-date'), tIn = root.querySelector('#tz-in-time');
      var sFrom = root.querySelector('#tz-from'), sTo = root.querySelector('#tz-to');
      var rTime = root.querySelector('#tz-res-time'), rDate = root.querySelector('#tz-res-date'), rFull = root.querySelector('#tz-res-full'), rDiff = root.querySelector('#tz-diff');

      var localZone = 'UTC';
      try { localZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch (e) { /* ignore */ }
      var foundLocal = ZONES.filter(function (z) { return z.tz === localZone; })[0];
      if (!foundLocal) ZONES.unshift({ label: 'Local: ' + localZone, tz: localZone });

      function populateSelects() {
        var opts = ZONES.map(function (z) { return '<option value="' + esc(z.tz) + '">' + esc(z.label) + '</option>'; }).join('');
        sFrom.innerHTML = opts; sTo.innerHTML = opts;
        sFrom.value = localZone;

        var now = new Date();
        dIn.value = now.toISOString().slice(0, 10);

      function convert() {

          var getOffset = function (tz, d) {
            var f = new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: false });
            var parts = f.formatToParts(d).reduce(function (acc, p) { acc[p.type] = p.value; return acc; }, {});
            var zonedDate = new Date(Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour === 24 ? 0 : +parts.hour, +parts.minute, +parts.second));
            return (zonedDate.getTime() - d.getTime());
          };

          var fromOffset = getOffset(fromZ, testDate);
          var exactUtc = new Date(testDate.getTime() - fromOffset);

          var outFmt = new Intl.DateTimeFormat('en-US', {
            timeZone: toZ,
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
            hour: 'numeric', minute: '2-digit', second: '2-digit',
            hour12: true,
