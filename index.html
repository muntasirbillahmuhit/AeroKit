          var timeFmt = new Intl.DateTimeFormat('en-US', { timeZone: toZ, hour: 'numeric', minute: '2-digit', hour12: true });
          var dateFmt = new Intl.DateTimeFormat('en-US', { timeZone: toZ, weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

          var toOffset = getOffset(toZ, exactUtc);
          var diffHours = (toOffset - fromOffset) / (3600 * 1000);
          var diffStr = diffHours === 0 ? 'Same Time' : (diffHours > 0 ? '+' + diffHours + ' hrs' : diffHours + ' hrs');

          rTime.textContent = timeFmt.format(exactUtc);
          rDate.textContent = dateFmt.format(exactUtc);
          rFull.textContent = outFmt.format(exactUtc) + ' (' + toZ + ')';
          rDiff.textContent = diffStr;
        } catch (err) {
          rTime.textContent = 'Error';
          rDate.textContent = 'Invalid date/time';
        }
      }

      populateSelects();
      setNow();
      convert();

      dIn.addEventListener('input', convert);
      tIn.addEventListener('input', convert);
      sFrom.addEventListener('change', convert);
      sTo.addEventListener('change', convert);

      root.querySelector('#tz-swap').addEventListener('click', function () {
        var tmp = sFrom.value; sFrom.value = sTo.value; sTo.value = tmp;
        convert();
        ctx.toast('Swapped time zones');
      });

      root.querySelector('#tz-now').addEventListener('click', function () {
        setNow(); convert(); ctx.toast('Current time loaded');
      });

      root.querySelector('#tz-copy').addEventListener('click', function () {
        var txt = rTime.textContent + ' · ' + rDate.textContent + ' (' + sTo.value + ')';
        A.copyText(txt).then(function (ok) { ctx.toast(ok ? 'Converted time copied' : 'Copy failed'); });
      });

      ui.bindCommon(root, ctx, function () { ctx.navigateCategory('datetime'); });
    },
  };

  // 4. ============================================================== Calendar
  V['calendar'] = {
    html: function () {
      return '<div class="body" style="overflow-y:auto">' +
        ui.header('Calendar', { right: '<button class="ib" id="cal-today-btn" aria-label="Go to Today" title="Go to Today" type="button">' + icon('spark', 18, 'color:var(--ac)') + '</button>' }) +

        '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;font-weight:700;color:var(--dim);margin-bottom:8px">' +

        '</div>';
    },
    mount: function (root, ctx) {
      var running = false;
      var startTime = 0, elapsedBefore = 0;
      var laps = [];
      var animId = null;

      var d = root.querySelector('#sw-display'), statusEl = root.querySelector('#sw-status');
      var bStart = root.querySelector('#sw-start'), bLap = root.querySelector('#sw-lap');
      var lapsEl = root.querySelector('#sw-laps'), lapCountEl = root.querySelector('#sw-lap-count');

      function formatMs(ms) {
        var totalSec = Math.floor(ms / 1000);
        var centi = Math.floor((ms % 1000) / 10);
        var m = Math.floor(totalSec / 60);
        var s = totalSec % 60;
        return pad(m) + ':' + pad(s) + '.' + pad(centi);
      }

      function getElapsed() {
        return running ? (performance.now() - startTime + elapsedBefore) : elapsedBefore;

      function renderLaps() {
        lapCountEl.textContent = laps.length;

        if (laps.length > 1) {
          laps.forEach(function (l, i) {
            if (l.split < minTime) { minTime = l.split; fastestIdx = i; }
            if (l.split > maxTime) { maxTime = l.split; slowestIdx = i; }
          });
        }

        lapsEl.innerHTML = laps.map(function (l, i) {
          var isFast = i === fastestIdx;
          var isSlow = i === slowestIdx;
          var col = isFast ? 'var(--ac)' : (isSlow ? '#ff7675' : 'var(--tx)');
          var tag = isFast ? '<span style="font-size:9.5px;color:var(--ac);font-weight:700">FASTEST</span>' : (isSlow ? '<span style="font-size:9.5px;color:#ff7675;font-weight:700">SLOWEST</span>' : '');

          bLap.innerHTML = icon('spark', 16) + '<span>Lap</span>';
          bLap.disabled = false;
          statusEl.textContent = 'RUNNING';
          statusEl.style.color = 'var(--ac)';
        } else if (elapsedBefore > 0) {
          bStart.innerHTML = icon('play', 16) + '<span>Resume</span>';
          bStart.style.background = 'linear-gradient(100deg, var(--ac) 35%, var(--cy))';
          bLap.innerHTML = icon('reset', 16) + '<span>Reset</span>';
          bLap.disabled = false;
          statusEl.textContent = 'PAUSED';
          statusEl.style.color = 'var(--dim)';
        } else {
          bStart.innerHTML = icon('play', 16) + '<span>Start</span>';
          bStart.style.background = 'linear-gradient(100deg, var(--ac) 35%, var(--cy))';
          bLap.innerHTML = icon('spark', 16) + '<span>Lap</span>';

          d.textContent = '00:00.00';
          renderLaps();

          ctx.toast('Stopwatch reset');

      renderLaps();
      updateButtons();

    mount: function (root, ctx) {
      var inH = root.querySelector('#tm-h'), inM = root.querySelector('#tm-m'), inS = root.querySelector('#tm-s');
      var setupBox = root.querySelector('#tm-setup'), runBox = root.querySelector('#tm-running');
      var bStart = root.querySelector('#tm-start'), bToggle = root.querySelector('#tm-toggle'), bCancel = root.querySelector('#tm-cancel');
      var cd = root.querySelector('#tm-countdown'), ring = root.querySelector('#tm-ring'), stEl = root.querySelector('#tm-status');
      var bPlus = root.querySelector('#tm-plus-min');

      var totalDuration = 0, remainingMs = 0, endTime = 0;
      var timerId = null, isRunning = false, isPaused = false;
      var circumference = 2 * Math.PI * 88;

      function formatTime(ms) {

        var h = Math.floor(sec / 3600);
        var m = Math.floor((sec % 3600) / 60);

        '<input type="checkbox" id="pom-auto" style="accent-color:var(--ac)"><span>Auto-advance to next session</span></label>' +
        '</div>' +
        '<div class="glass" style="padding:28px 18px;border-radius:24px;text-align:center;position:relative">' +
        '<div id="pom-display" style="font-size:54px;font-weight:900;letter-spacing:-1px;color:var(--tx);font-variant-numeric:tabular-nums;line-height:1">25:00</div>' +
        '<div id="pom-badge" style="display:inline-block;font-size:11px;font-weight:800;letter-spacing:0.5px;color:var(--act);background:rgba(198,255,61,0.15);padding:3px 12px;border-radius:99px;margin-top:12px;text-transform:uppercase">Focus Session</div>' +
        '<div id="pom-dots" style="display:flex;justify-content:center;gap:6px;margin-top:14px"></div>' +
        '</div>' +
        '<div style="display:flex;gap:10px;margin-top:16px">' +
        '<button type="button" class="btn" id="pom-start" style="flex:1;height:48px;font-size:15px">' + icon('play', 16) + '<span>Start Focus</span></button>' +
        '<button type="button" class="btn glass" id="pom-skip" style="width:84px;height:48px;font-size:13px;background:var(--s2);color:var(--tx);box-shadow:none" title="Skip Session">' + icon('arrow', 16) + '</button>' +
        '<button type="button" class="btn glass" id="pom-reset" style="width:52px;height:48px;font-size:13px;background:var(--s2);color:var(--tx);box-shadow:none" title="Reset">' + icon('reset', 16) + '</button>' +
        '</div>' +
        '<div class="glass" style="margin-top:14px;padding:12px 14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center">' +
        '<span style="font-size:12px;color:var(--mut);font-weight:600">Total Completed Today</span>' +
        '<b id="pom-total" style="font-size:14px;color:var(--ac)">0 Pomodoros</b>' +
        '</div></div>';
    },
    mount: function (root, ctx) {
      var cfg = A.store.get('aerokit_pomodoro_cfg', { work: 25, short: 5, long: 15, auto: true });
      var totalCompleted = A.store.get('aerokit_pomodoro_completed', 0);
      var currentMode = 'work';
      var cycleCount = 0;
      var isRunning = false, isPaused = false;
      var remainingMs = cfg.work * 60 * 1000;
      var endTime = 0, timerId = null;

      var dEl = root.querySelector('#pom-display'), bEl = root.querySelector('#pom-badge'), dotsEl = root.querySelector('#pom-dots');
      var bStart = root.querySelector('#pom-start'), bSkip = root.querySelector('#pom-skip'), bReset = root.querySelector('#pom-reset');
      var totEl = root.querySelector('#pom-total'), pPanel = root.querySelector('#pom-settings-panel');
      var modeBtns = root.querySelectorAll('#pom-modes button');

      var inW = root.querySelector('#pom-cfg-w'), inS = root.querySelector('#pom-cfg-s'), inL = root.querySelector('#pom-cfg-l'), inAuto = root.querySelector('#pom-auto');
      inW.value = cfg.work; inS.value = cfg.short; inL.value = cfg.long; inAuto.checked = !!cfg.auto;

      function renderDots() {
        var h = '';
        for (var i = 0; i < 4; i++) {
          var on = i < (cycleCount % 4);
          h += '<span style="width:10px;height:10px;border-radius:50%;background:' + (on ? 'var(--ac)' : 'var(--s3)') + ';box-shadow:' + (on ? '0 0 8px var(--ac)' : 'none') + '"></span>';
        }
        dotsEl.innerHTML = h;
        totEl.textContent = totalCompleted + ' Pomodoro' + (totalCompleted === 1 ? '' : 's');
      }

      function getModeDuration(m) {
        return (m === 'work' ? cfg.work : (m === 'short' ? cfg.short : cfg.long)) * 60 * 1000;
      }

      function formatTime(ms) {
        var sec = Math.ceil(ms / 1000);
        return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60);
      }

      function updateTabs() {
        modeBtns.forEach(function (b) {
          b.classList.toggle('on', b.getAttribute('data-pmode') === currentMode);
        });
        if (currentMode === 'work') {
          bEl.textContent = 'Focus Session (' + (cycleCount % 4 + 1) + '/4)';
          bEl.style.color = 'var(--act)';
          bEl.style.background = 'rgba(198,255,61,0.15)';
        } else if (currentMode === 'short') {
          bEl.textContent = 'Short Break';
          bEl.style.color = 'var(--cy)';
          bEl.style.background = 'rgba(69,217,232,0.15)';
        } else {
          bEl.textContent = 'Long Rest Cycle';
          bEl.style.color = 'var(--bl)';
          bEl.style.background = 'rgba(105,169,232,0.15)';
        }
      }

      function tick() {
        if (!isRunning) return;
        var now = Date.now();
        var rem = Math.max(0, endTime - now);
        dEl.textContent = formatTime(rem);

        if (rem <= 0) {
          isRunning = false;
          clearInterval(timerId);
          playAlertChime();
          if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200, 100, 400]); } catch (e) { /* ignore */ } }

          if (currentMode === 'work') {
            cycleCount++;
            totalCompleted++;
            A.store.set('aerokit_pomodoro_completed', totalCompleted);
            ctx.toast('Work session complete! Time for a break.');
            currentMode = (cycleCount % 4 === 0) ? 'long' : 'short';
          } else {
            ctx.toast('Break over! Ready to focus?');
            currentMode = 'work';
          }

          remainingMs = getModeDuration(currentMode);
          dEl.textContent = formatTime(remainingMs);
          renderDots();
          updateTabs();

          if (cfg.auto) {
            endTime = Date.now() + remainingMs;
            isRunning = true;
            bStart.innerHTML = icon('pause', 16) + '<span>Pause</span>';
            timerId = setInterval(tick, 250);
          } else {
            bStart.innerHTML = icon('play', 16) + '<span>Start ' + (currentMode === 'work' ? 'Focus' : 'Break') + '</span>';
          }
        }
      }

      bStart.addEventListener('click', function () {
        if (isRunning) {
          isRunning = false;
          isPaused = true;
          clearInterval(timerId);
          remainingMs = Math.max(0, endTime - Date.now());
          bStart.innerHTML = icon('play', 16) + '<span>Resume</span>';
        } else {
          isRunning = true;
          isPaused = false;
          endTime = Date.now() + remainingMs;
          bStart.innerHTML = icon('pause', 16) + '<span>Pause</span>';
          timerId = setInterval(tick, 250);
        }
      });

      bSkip.addEventListener('click', function () {
        isRunning = false;
        isPaused = false;
        clearInterval(timerId);
        if (currentMode === 'work') {
          cycleCount++;
          currentMode = (cycleCount % 4 === 0) ? 'long' : 'short';
        } else {
          currentMode = 'work';
        }
        remainingMs = getModeDuration(currentMode);
        dEl.textContent = formatTime(remainingMs);
        bStart.innerHTML = icon('play', 16) + '<span>Start ' + (currentMode === 'work' ? 'Focus' : 'Break') + '</span>';
        updateTabs();
        renderDots();
        ctx.toast('Skipped to next session');
      });

      bReset.addEventListener('click', function () {
        isRunning = false;
        isPaused = false;
        clearInterval(timerId);
        remainingMs = getModeDuration(currentMode);
        dEl.textContent = formatTime(remainingMs);
        bStart.innerHTML = icon('play', 16) + '<span>Start ' + (currentMode === 'work' ? 'Focus' : 'Break') + '</span>';
        ctx.toast('Session reset');
      });

      root.querySelector('#pom-modes').addEventListener('click', function (e) {
        var b = e.target.closest('[data-pmode]');
        if (b) {
          var m = b.getAttribute('data-pmode');
          if (m === currentMode) return;
          isRunning = false; isPaused = false; clearInterval(timerId);
          currentMode = m;
          remainingMs = getModeDuration(currentMode);
          dEl.textContent = formatTime(remainingMs);
          bStart.innerHTML = icon('play', 16) + '<span>Start ' + (currentMode === 'work' ? 'Focus' : 'Break') + '</span>';
          updateTabs();
        }
      });

      root.querySelector('#pom-gear').addEventListener('click', function () {
        pPanel.style.display = pPanel.style.display === 'none' ? 'block' : 'none';
      });

      function saveCfg() {
        cfg.work = Math.max(1, parseInt(inW.value, 10) || 25);
        cfg.short = Math.max(1, parseInt(inS.value, 10) || 5);
        cfg.long = Math.max(1, parseInt(inL.value, 10) || 15);
        cfg.auto = inAuto.checked;
        A.store.set('aerokit_pomodoro_cfg', cfg);
        if (!isRunning && !isPaused) {
          remainingMs = getModeDuration(currentMode);
          dEl.textContent = formatTime(remainingMs);
        }
      }

      inW.addEventListener('input', saveCfg);
      inS.addEventListener('input', saveCfg);
      inL.addEventListener('input', saveCfg);
      inAuto.addEventListener('change', saveCfg);

      remainingMs = getModeDuration(currentMode);
      dEl.textContent = formatTime(remainingMs);
      updateTabs();
      renderDots();
      ui.bindCommon(root, ctx, function () { ctx.navigateCategory('datetime'); });
      return function () { isRunning = false; clearInterval(timerId); };
    },
  };

  // 8. ============================================================== Tally Counter
  V['tally-counter'] = {
    html: function () {
      return '<div class="body" style="overflow-y:auto">' +
        ui.header('Tally Counter', { right: '<button class="ib" id="tc-reset" aria-label="Reset Count" title="Reset Count" type="button">' + icon('reset', 18) + '</button>' }) +
        '<div class="tabs" id="tc-steps" style="margin-bottom:12px">' +
        '<button type="button" class="on" data-step="1">Step: +1</button>' +
        '<button type="button" data-step="5">Step: +5</button>' +
        '<button type="button" data-step="10">Step: +10</button>' +
        '</div>' +
        '<div class="glass" style="padding:40px 18px;border-radius:24px;text-align:center;position:relative">' +
        '<div style="font-size:11px;font-weight:700;color:var(--dim);letter-spacing:1px;text-transform:uppercase">CURRENT COUNT</div>' +
        '<div id="tc-count" style="font-size:74px;font-weight:900;letter-spacing:-2px;color:var(--ac);line-height:1;margin:12px 0">0</div>' +
        '<div id="tc-info" style="font-size:11.5px;color:var(--mut)">Tap anywhere on increment button to count</div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">' +
        '<button type="button" class="btn" id="tc-inc" style="height:76px;font-size:28px;border-radius:20px;box-shadow:0 0 28px rgba(198,255,61,0.35)">' +
        icon('plus', 28) + '</button>' +
        '<div style="display:flex;gap:10px">' +
        '<button type="button" class="btn glass" id="tc-dec" style="flex:1;height:48px;font-size:18px;background:var(--s2);color:var(--tx);box-shadow:none;border-radius:14px">' +
        icon('minus', 20) + '</button>' +
        '<button type="button" class="btn glass" id="tc-zero" style="flex:1;height:48px;font-size:13px;background:var(--s2);color:var(--mut);box-shadow:none;border-radius:14px">' +
        'Clear (0)</button>' +
        '</div></div></div>';
    },
    mount: function (root, ctx) {
      var count = A.store.get('aerokit_tally_count', 0);
      var step = 1;

      var cEl = root.querySelector('#tc-count');
      var bInc = root.querySelector('#tc-inc'), bDec = root.querySelector('#tc-dec'), bZero = root.querySelector('#tc-zero'), bReset = root.querySelector('#tc-reset');
      var stepBtns = root.querySelectorAll('#tc-steps button');

      function paint() {
        cEl.textContent = count;
        A.store.set('aerokit_tally_count', count);
      }

      function haptic() {
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) { /* ignore */ } }
      }

      bInc.addEventListener('click', function () {
        count += step;
        paint();
        haptic();
      });

      bDec.addEventListener('click', function () {
        if (count > 0) {
          count = Math.max(0, count - step);
          paint();
          haptic();
        } else {
          ctx.toast('Count cannot be less than zero');
        }
      });

      function doReset() {
        count = 0;
        paint();
        ctx.toast('Count reset to 0');
      }

      bZero.addEventListener('click', doReset);
      bReset.addEventListener('click', doReset);

      root.querySelector('#tc-steps').addEventListener('click', function (e) {
        var b = e.target.closest('[data-step]');
        if (b) {
          step = parseInt(b.getAttribute('data-step'), 10) || 1;
          stepBtns.forEach(function (btn) { btn.classList.toggle('on', btn === b); });
          ctx.toast('Counting by ' + step);
        }
      });

      paint();
      ui.bindCommon(root, ctx, function () { ctx.navigateCategory('datetime'); });
    },
  };
})(window.AeroKit = window.AeroKit || {});

</script>
<script>
/* js/views-measurement.js */
/* AeroKit — Measurement Category: Ruler, Protractor, Spirit Level, Vibratometer, Pedometer, Speed Test, Pendulum, Sound & Light Meters */
(function (A) {
  'use strict';
  var icon = A.icon, esc = A.esc, ui = A.ui, V = A.views;

  function bindToolBack(root, ctx, catId) {
    ui.bindCommon(root, ctx, function () { ctx.navigateCategory(catId || 'measurement'); });
  }

  function fmt(n, d) {
    return Number(n || 0).toFixed(d !== undefined ? d : 1);
  }

  // =========================================================================
  // 1. RULER
  // =========================================================================
  V['ruler'] = {
    html: function () {
      return '<div class="body" style="overflow-y:auto">' +
        ui.header('Ruler') +
        '<div style="display:flex;flex-direction:column;gap:12px;padding-bottom:20px">' +
        '<div class="glass" style="padding:12px 14px;border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--bd)">' +
        '<div style="display:flex;gap:6px" id="ruler-unit-group">' +
        '<button class="btn on" data-unit="mm" style="padding:6px 12px;font-size:12px;border-radius:10px">mm</button>' +
        '<button class="btn" data-unit="cm" style="padding:6px 12px;font-size:12px;border-radius:10px">cm</button>' +
        '<button class="btn" data-unit="in" style="padding:6px 12px;font-size:12px;border-radius:10px">inch</button>' +
        '</div>' +
        '<div style="display:flex;gap:6px">' +
        '<button class="ib" id="ruler-calib-btn" title="Calibrate DPI" style="padding:6px;border-radius:10px;background:var(--s2)">' + icon('gear', 16) + '</button>' +
        '<button class="ib" id="ruler-reset-btn" title="Reset Markers" style="padding:6px;border-radius:10px;background:var(--s2)">' + icon('reset', 16) + '</button>' +
        '</div></div>' +
        '<div class="glass" id="ruler-calib-panel" style="display:none;padding:12px;border-radius:16px;border:1px solid var(--bd)">' +
        '<div style="font-size:12px;font-weight:700;margin-bottom:6px;color:var(--tx)">Screen Scale Calibration</div>' +
        '<div style="font-size:11px;color:var(--mut);margin-bottom:8px">Standard Credit Card Width: 85.6 mm. Adjust slider to fit card.</div>' +
        '<input type="range" id="ruler-dpi-range" min="80" max="320" value="160" style="width:100%">' +
        '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px">' +
        '<span>DPI: <b id="ruler-dpi-val">160</b></span>' +
        '<button class="btn" id="ruler-dpi-preset" style="padding:2px 8px;font-size:10px">85.6mm Preset</button>' +
        '</div></div>' +
        '<div class="glass" style="padding:16px;border-radius:20px;text-align:center;border:1px solid var(--bd);background:var(--s1)">' +
        '<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:700">Measured Length</div>' +
        '<div id="ruler-readout" style="font-size:32px;font-weight:900;color:var(--ac);margin:4px 0">0.0 mm</div>' +
        '<div id="ruler-sub-readout" style="font-size:12px;color:var(--cy);font-weight:600">Marker A: 20mm · Marker B: 80mm</div>' +
        '</div>' +
        '<div class="glass" id="ruler-canvas-wrap" style="position:relative;height:320px;border-radius:20px;overflow:hidden;border:1px solid var(--bd);background:var(--bg);touch-action:none;user-select:none">' +
        '<canvas id="ruler-canvas" style="width:100%;height:100%;display:block"></canvas>' +
        '</div></div></div>';
    },
    mount: function (root, ctx) {
      bindToolBack(root, ctx);
      var wrap = root.querySelector('#ruler-canvas-wrap');
      var canvas = root.querySelector('#ruler-canvas');
      var readout = root.querySelector('#ruler-readout');
      var subReadout = root.querySelector('#ruler-sub-readout');
      var calibBtn = root.querySelector('#ruler-calib-btn');
      var calibPanel = root.querySelector('#ruler-calib-panel');
      var dpiRange = root.querySelector('#ruler-dpi-range');
      var dpiVal = root.querySelector('#ruler-dpi-val');
      var dpiPreset = root.querySelector('#ruler-dpi-preset');
      var resetBtn = root.querySelector('#ruler-reset-btn');
      var unitBtns = root.querySelectorAll('#ruler-unit-group button');

      var unit = 'mm';
      var ppi = parseFloat(localStorage.getItem('aerokit_ruler_ppi')) || (window.devicePixelRatio * 160) || 160;
      dpiRange.value = Math.round(ppi);
      dpiVal.textContent = Math.round(ppi);

      var markerA = 40;
      var markerB = 200;
      var activeMarker = null;

      function getDpr() { return window.devicePixelRatio || 1; }

      function redraw() {
        var rect = wrap.getBoundingClientRect();
        var dpr = getDpr();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        var c = canvas.getContext('2d');
        c.scale(dpr, dpr);

        c.clearRect(0, 0, rect.width, rect.height);

        var pxPerMm = ppi / 25.4;
        var pxPerInch = ppi;

        c.strokeStyle = 'rgba(255,255,255,0.2)';
        c.fillStyle = 'var(--tx)';
        c.font = '10px sans-serif';

        if (unit === 'in') {
          var numInches = Math.ceil(rect.height / pxPerInch);
          for (var i = 0; i <= numInches * 16; i++) {
            var y = i * (pxPerInch / 16);
            if (y > rect.height) break;
            var isMain = (i % 16 === 0);
            var isHalf = (i % 8 === 0);
            var isQuarter = (i % 4 === 0);
            var tickLen = isMain ? 24 : (isHalf ? 16 : (isQuarter ? 10 : 6));

            c.beginPath();
            c.moveTo(0, y); c.lineTo(tickLen, y);
            c.moveTo(rect.width, y); c.lineTo(rect.width - tickLen, y);
            c.stroke();

            if (isMain && i > 0) {
              c.fillText((i / 16) + '"', 28, y + 3);
            }
          }
        } else {
          var numMm = Math.ceil(rect.height / pxPerMm);
          for (var m = 0; m <= numMm; m++) {
            var my = m * pxPerMm;
            if (my > rect.height) break;
            var isCm = (m % 10 === 0);
            var is5mm = (m % 5 === 0);
            var tLen = isCm ? 26 : (is5mm ? 16 : 8);

            c.beginPath();
            c.moveTo(0, my); c.lineTo(tLen, my);
            c.moveTo(rect.width, my); c.lineTo(rect.width - tLen, my);
            c.stroke();

            if (isCm && m > 0) {
              var labelVal = (unit === 'cm') ? (m / 10) + ' cm' : m + ' mm';
              c.fillText(labelVal, 30, my + 3);
            }
          }
        }

        // Marker A
        c.strokeStyle = '#45D9E8';
        c.lineWidth = 2;
        c.beginPath(); c.moveTo(0, markerA); c.lineTo(rect.width, markerA); c.stroke();
        c.fillStyle = '#45D9E8';
        c.beginPath(); c.arc(rect.width / 2 - 40, markerA, 8, 0, Math.PI * 2); c.fill();

        // Marker B
        c.strokeStyle = '#c6ff3d';
        c.lineWidth = 2;
        c.beginPath(); c.moveTo(0, markerB); c.lineTo(rect.width, markerB); c.stroke();
        c.fillStyle = '#c6ff3d';
        c.beginPath(); c.arc(rect.width / 2 + 40, markerB, 8, 0, Math.PI * 2); c.fill();

        var distPx = Math.abs(markerB - markerA);
        var distMm = distPx / pxPerMm;
        var distCm = distMm / 10;
        var distIn = distPx / pxPerInch;

        if (unit === 'cm') {
          readout.textContent = fmt(distCm, 2) + ' cm';
        } else if (unit === 'in') {
          readout.textContent = fmt(distIn, 2) + ' in';
        } else {
          readout.textContent = fmt(distMm, 1) + ' mm';
        }

        subReadout.textContent = 'A: ' + fmt(markerA / pxPerMm, 1) + 'mm · B: ' + fmt(markerB / pxPerMm, 1) + 'mm';
      }

      function handleDrag(clientY) {
        var rect = wrap.getBoundingClientRect();
        var y = Math.max(0, Math.min(rect.height, clientY - rect.top));
        if (activeMarker === 'A') markerA = y;
        else if (activeMarker === 'B') markerB = y;
        redraw();
      }

      wrap.addEventListener('pointerdown', function (e) {
        var rect = wrap.getBoundingClientRect();
        var y = e.clientY - rect.top;
        if (Math.abs(y - markerA) < Math.abs(y - markerB)) activeMarker = 'A';
        else activeMarker = 'B';
        handleDrag(e.clientY);
      });

      wrap.addEventListener('pointermove', function (e) {
        if (e.buttons === 1 || activeMarker) {
          handleDrag(e.clientY);
        }
      });

      window.addEventListener('pointerup', function () { activeMarker = null; });

      unitBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          unitBtns.forEach(function (b) { b.classList.remove('on'); });
          btn.classList.add('on');
          unit = btn.getAttribute('data-unit');
          redraw();
        });
      });

      calibBtn.addEventListener('click', function () {
        calibPanel.style.display = calibPanel.style.display === 'none' ? 'block' : 'none';
      });

      dpiRange.addEventListener('input', function () {
        ppi = parseFloat(dpiRange.value);
        dpiVal.textContent = Math.round(ppi);
        localStorage.setItem('aerokit_ruler_ppi', ppi);
        redraw();
      });

      dpiPreset.addEventListener('click', function () {
        ppi = 180;
        dpiRange.value = 180;
        dpiVal.textContent = 180;
        localStorage.setItem('aerokit_ruler_ppi', ppi);
        redraw();
      });

      resetBtn.addEventListener('click', function () {
        markerA = 40;
        markerB = 200;
        redraw();
      });

      redraw();
    }
  };

  // =========================================================================
  // 2. PROTRACTOR
  // =========================================================================
  V['protractor'] = {
    html: function () {
      return '<div class="body" style="overflow-y:auto">' +
        ui.header('Protractor') +
        '<div style="display:flex;flex-direction:column;gap:12px;padding-bottom:20px">' +
        '<div class="glass" style="padding:12px;border-radius:18px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--bd)">' +

    mount: function (root, ctx) {
      bindToolBack(root, ctx);
      var wrap = root.querySelector('#prot-canvas-wrap');
      var canvas = root.querySelector('#prot-canvas');
      var video = root.querySelector('#prot-video');
      var readout = root.querySelector('#prot-readout');
      var subReadout = root.querySelector('#prot-sub-readout');
      var modeBtns = root.querySelectorAll('#prot-mode-group button');
      var camBtn = root.querySelector('#prot-cam-btn');
      var camMsg = root.querySelector('#prot-cam-msg');

      var angle = 45;
      var mode = '180';
      var stream = null;

      function getDpr() { return window.devicePixelRatio || 1; }

      function redraw() {
        var rect = wrap.getBoundingClientRect();
        var dpr = getDpr();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        var c = canvas.getContext('2d');
        c.scale(dpr, dpr);

        c.clearRect(0, 0, rect.width, rect.height);

        var cx = rect.width / 2;
        var cy = mode === '180' ? rect.height - 30 : rect.height / 2;
        var r = Math.min(rect.width / 2 - 20, (mode === '180' ? rect.height - 50 : rect.height / 2 - 20));

        c.strokeStyle = 'var(--bd)';
        c.lineWidth = 2;
        c.beginPath();
        if (mode === '180') {
          c.arc(cx, cy, r, Math.PI, 0, false);
        } else {
          c.arc(cx, cy, r, 0, Math.PI * 2, false);
        }
        c.stroke();

        c.strokeStyle = 'var(--mut)';
        c.lineWidth = 1.5;
        c.beginPath();
        c.moveTo(cx - r - 10, cy); c.lineTo(cx + r + 10, cy);
        c.stroke();

        c.fillStyle = 'var(--tx)';
        c.font = '10px sans-serif';
        c.textAlign = 'center';

        var maxDeg = mode === '180' ? 180 : 360;
        for (var deg = 0; deg <= maxDeg; deg += 5) {
          var rad = (mode === '180' ? (180 - deg) : deg) * Math.PI / 180;
          var is10 = deg % 10 === 0;
          var tLen = is10 ? 12 : 6;

          var x1 = cx + r * Math.cos(rad);
          var y1 = cy - r * Math.sin(rad);
          var x2 = cx + (r - tLen) * Math.cos(rad);
          var y2 = cy - (r - tLen) * Math.sin(rad);

          c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();

          if (is10) {
            var lx = cx + (r - 22) * Math.cos(rad);
            var ly = cy - (r - 22) * Math.sin(rad) + 3;
            c.fillText(deg + '°', lx, ly);
          }
        }

        var rayRad = (mode === '180' ? (180 - angle) : angle) * Math.PI / 180;
        var rx = cx + (r + 10) * Math.cos(rayRad);
        var ry = cy - (r + 10) * Math.sin(rayRad);

        c.strokeStyle = '#c6ff3d';
        c.lineWidth = 3;
        c.beginPath(); c.moveTo(cx, cy); c.lineTo(rx, ry); c.stroke();

        c.fillStyle = '#c6ff3d';
        c.beginPath(); c.arc(rx, ry, 7, 0, Math.PI * 2); c.fill();

        c.fillStyle = '#45D9E8';
        c.beginPath(); c.arc(cx, cy, 6, 0, Math.PI * 2); c.fill();

        readout.textContent = fmt(angle, 1) + '°';
        var rads = (angle * Math.PI / 180);
        var supp = mode === '180' ? (180 - angle) : (360 - angle);
        subReadout.textContent = fmt(rads, 3) + ' rad · Supp: ' + fmt(supp, 1) + '°';
      }

      function updateAngleFromTouch(e) {
        var rect = wrap.getBoundingClientRect();
        var cx = rect.width / 2;
        var cy = mode === '180' ? rect.height - 30 : rect.height / 2;
        var x = e.clientX - rect.left - cx;
        var y = cy - (e.clientY - rect.top);

        var rad = Math.atan2(y, x);
        var deg = rad * 180 / Math.PI;

        if (mode === '180') {
          if (deg < 0) deg = 0;
          deg = 180 - deg;
        } else {
          if (deg < 0) deg += 360;
        }

        angle = Math.max(0, Math.min(mode === '180' ? 180 : 360, deg));
        redraw();
      }

      wrap.addEventListener('pointerdown', updateAngleFromTouch);
      wrap.addEventListener('pointermove', function (e) {
        if (e.buttons === 1) updateAngleFromTouch(e);
      });

      modeBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          modeBtns.forEach(function (b) { b.classList.remove('on'); });
          btn.classList.add('on');
          mode = btn.getAttribute('data-mode');
          if (mode === '180' && angle > 180) angle = 180;
          redraw();
        });
      });

      camBtn.addEventListener('click', function () {
        if (stream) {
          stream.getTracks().forEach(function (t) { t.stop(); });
          stream = null;
          video.style.display = 'none';
          camMsg.style.display = 'none';
          ctx.toast('Camera overlay disabled');
        } else {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
              .then(function (s) {
                stream = s;
                video.srcObject = s;
                video.style.display = 'block';
                camMsg.style.display = 'block';
                ctx.toast('Camera overlay enabled');
              })
              .catch(function () {
                ctx.toast('Camera permission denied or camera unavailable');
              });
          } else {
            ctx.toast('Camera stream not supported in browser');
          }
        }
      });

      redraw();
    }
  };

    mount: function (root, ctx) {

      var bubble = root.querySelector('#level-bubble');
      var readout = root.querySelector('#level-readout');
      var subReadout = root.querySelector('#level-sub-readout');
      var calibBtn = root.querySelector('#level-calib-btn');
      var resetBtn = root.querySelector('#level-reset-btn');
      var simPitch = root.querySelector('#level-sim-pitch');
      var simRoll = root.querySelector('#level-sim-roll');

      var zeroBeta = 0, zeroGamma = 0;
      var currentBeta = 0, currentGamma = 0;

      function updateDisplay() {
        var beta = currentBeta - zeroBeta;
        var gamma = currentGamma - zeroGamma;

        var maxOffset = 80;
        var bx = Math.max(-maxOffset, Math.min(maxOffset, (gamma / 45) * maxOffset));
        var by = Math.max(-maxOffset, Math.min(maxOffset, (beta / 45) * maxOffset));

        bubble.style.transform = 'translate(' + bx.toFixed(1) + 'px, ' + by.toFixed(1) + 'px)';

        var totalAngle = Math.sqrt(beta * beta + gamma * gamma);
        readout.textContent = fmt(totalAngle, 1) + '°';

        if (totalAngle < 0.5) {
          bubble.style.background = '#c6ff3d';
          bubble.style.boxShadow = '0 0 16px #c6ff3d';
        } else {
          bubble.style.background = '#45D9E8';
          bubble.style.boxShadow = '0 0 12px #45D9E8';
        }

        subReadout.textContent = 'Pitch: ' + fmt(beta, 1) + '° · Roll: ' + fmt(gamma, 1) + '°';
      }

      function handleOrientation(e) {
        if (e.beta !== null && e.gamma !== null) {
          currentBeta = e.beta;
          currentGamma = e.gamma;
          simPitch.value = Math.round(e.beta);
          simRoll.value = Math.round(e.gamma);
          updateDisplay();
        }
      }

      if (window.DeviceOrientationEvent) {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(function (res) {
            if (res === 'granted') window.addEventListener('deviceorientation', handleOrientation);
          }).catch(function () {});
        } else {
          window.addEventListener('deviceorientation', handleOrientation);
        }
      }

      simPitch.addEventListener('input', function () {
        currentBeta = parseFloat(simPitch.value);
        updateDisplay();
      });

      simRoll.addEventListener('input', function () {
        currentGamma = parseFloat(simRoll.value);
        updateDisplay();
      });

      calibBtn.addEventListener('click', function () {
        zeroBeta = currentBeta;
        zeroGamma = currentGamma;
        ctx.toast('Calibrated current position as relative zero');
        updateDisplay();
      });

      resetBtn.addEventListener('click', function () {
        zeroBeta = 0;
        zeroGamma = 0;
        ctx.toast('Zero offset reset');
        updateDisplay();
      });

      updateDisplay();

      return function () {
        window.removeEventListener('deviceorientation', handleOrientation);
      };
    }
  };

        '<button class="btn" id="vib-test-btn" style="padding:8px 16px">+ Vibrate Test</button>' +
        '</div></div></div>';
    },
    mount: function (root, ctx) {
      bindToolBack(root, ctx);
      var canvas = root.querySelector('#vib-canvas');
      var readout = root.querySelector('#vib-readout');
      var severity = root.querySelector('#vib-severity');
      var peakEl = root.querySelector('#vib-peak');
      var toggleBtn = root.querySelector('#vib-toggle-btn');
      var resetBtn = root.querySelector('#vib-reset-btn');
      var testBtn = root.querySelector('#vib-test-btn');

      var running = true;
      var history = new Array(80).fill(0);
      var maxPeak = 0;
      var simulatedValue = 0;

      function redraw() {
        var rect = canvas.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        var c = canvas.getContext('2d');
        c.scale(dpr, dpr);

        c.clearRect(0, 0, rect.width, rect.height);

        c.strokeStyle = '#45D9E8';
        c.lineWidth = 2;
        c.beginPath();

        var step = rect.width / (history.length - 1);
        for (var i = 0; i < history.length; i++) {
          var val = history[i];
          var y = rect.height / 2 - (val / 10) * (rect.height / 2);
          y = Math.max(5, Math.min(rect.height - 5, y));
          var x = i * step;
          if (i === 0) c.moveTo(x, y);
          else c.lineTo(x, y);
        }
        c.stroke();
      }

      function handleMotion(e) {
        if (!running) return;
        var acc = e.accelerationIncludingGravity || e.acceleration;
        if (acc) {
          var x = acc.x || 0, y = acc.y || 0, z = acc.z || 0;
          var mag = Math.abs(Math.sqrt(x * x + y * y + z * z) - 9.81) + simulatedValue;
          simulatedValue = Math.max(0, simulatedValue * 0.85);

          history.shift();
          history.push(mag);

          if (mag > maxPeak) maxPeak = mag;

          readout.textContent = fmt(mag, 2) + ' m/s²';
          peakEl.textContent = 'Peak: ' + fmt(maxPeak, 2) + ' m/s²';

          if (mag < 0.2) severity.textContent = 'Quiet · Micro Vibration';
          else if (mag < 1.0) severity.textContent = 'Minor · Gentle Motion';
          else if (mag < 3.0) severity.textContent = 'Moderate · Shaking';
          else severity.textContent = 'Strong · Intense Vibration';

          redraw();
        }
      }

      if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', handleMotion);
      }

      toggleBtn.addEventListener('click', function () {
        running = !running;
        toggleBtn.textContent = running ? 'Pause' : 'Resume';
        toggleBtn.classList.toggle('on', running);
      });

      resetBtn.addEventListener('click', function () {
        maxPeak = 0;
        history.fill(0);
        peakEl.textContent = 'Peak: 0.00 m/s²';
        redraw();
        ctx.toast('Peak vibration reset');
      });

      testBtn.addEventListener('click', function () {
        simulatedValue = 4.5;
        if (navigator.vibrate) navigator.vibrate(200);
        ctx.toast('Vibration pulse triggered');
      });

      redraw();

      return function () {
        window.removeEventListener('devicemotion', handleMotion);
      };
    }
  };

        '<div style="display:flex;flex-direction:column;gap:10px">' +
        '<div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut)"><span>String Length (L):</span><span id="pen-l-val">1.0 m</span></div>' +
        '<input type="range" id="pen-length" min="0.2" max="2.5" step="0.1" value="1.0" style="width:100%"></div>' +
        '<div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut)"><span>Gravity (g):</span><span id="pen-g-val">9.81 m/s² (Earth)</span></div>' +
        '<input type="range" id="pen-gravity" min="1.6" max="24.8" step="0.1" value="9.81" style="width:100%"></div>' +
        '</div></div></div></div>';
    },
    mount: function (root, ctx) {
      bindToolBack(root, ctx);
      var canvas = root.querySelector('#pen-canvas');
      var periodEl = root.querySelector('#pen-period');
      var subEl = root.querySelector('#pen-sub');
      var lenSlider = root.querySelector('#pen-length');
      var gSlider = root.querySelector('#pen-gravity');
      var lenVal = root.querySelector('#pen-l-val');
      var gVal = root.querySelector('#pen-g-val');

      var length = 1.0;
      var g = 9.81;
      var angle = Math.PI / 4;
      var angleVel = 0;
      var running = true;

      function loop() {
        if (!running) return;
        var dt = 0.016;
        var angleAccel = (-g / length) * Math.sin(angle);
        angleVel += angleAccel * dt;
        angleVel *= 0.998;
        angle += angleVel * dt;

        var rect = canvas.getBoundingClientRect();
        var dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        var c = canvas.getContext('2d');
        c.scale(dpr, dpr);

        c.clearRect(0, 0, rect.width, rect.height);

        var cx = rect.width / 2;
        var cy = 30;
        var renderLen = length * 70;

        var px = cx + renderLen * Math.sin(angle);
        var py = cy + renderLen * Math.cos(angle);

        c.strokeStyle = 'var(--bd)';
        c.lineWidth = 2;
        c.beginPath(); c.moveTo(cx, cy); c.lineTo(px, py); c.stroke();

        c.fillStyle = '#c6ff3d';
        c.beginPath(); c.arc(px, py, 14, 0, Math.PI * 2); c.fill();

        c.fillStyle = '#45D9E8';
        c.beginPath(); c.arc(cx, cy, 6, 0, Math.PI * 2); c.fill();

        var period = 2 * Math.PI * Math.sqrt(length / g);
        var freq = 1 / period;

        periodEl.textContent = fmt(period, 2) + ' s';
        subEl.textContent = 'Frequency: ' + fmt(freq, 2) + ' Hz · Length: ' + fmt(length, 2) + ' m';

        requestAnimationFrame(loop);
      }

      lenSlider.addEventListener('input', function () {
        length = parseFloat(lenSlider.value);
        lenVal.textContent = fmt(length, 1) + ' m';
      });

      gSlider.addEventListener('input', function () {
        g = parseFloat(gSlider.value);
        gVal.textContent = fmt(g, 2) + ' m/s²';
      });

      loop();

      return function () { running = false; };
    }
  };

    mount: function (root, ctx) {
      bindToolBack(root, ctx);
      var dbEl = root.querySelector('#snd-db');
      var levelEl = root.querySelector('#snd-level');
      var peakEl = root.querySelector('#snd-peak');
      var avgEl = root.querySelector('#snd-avg');
      var micBtn = root.querySelector('#snd-mic-btn');

      var peak = 42;
      var activeStream = null;

      micBtn.addEventListener('click', function () {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ audio: true })
            .then(function (stream) {
              activeStream = stream;
              micBtn.textContent = 'Microphone Active';
              micBtn.disabled = true;
              ctx.toast('Microphone input streaming');

              var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              var analyser = audioCtx.createAnalyser();
              var src = audioCtx.createMediaStreamSource(stream);
              src.connect(analyser);
              analyser.fftSize = 256;

              var data = new Uint8Array(analyser.frequencyBinCount);
              function poll() {
                if (!activeStream) return;
                analyser.getByteFrequencyData(data);
                var sum = 0;
                for (var i = 0; i < data.length; i++) sum += data[i];
                var avg = sum / data.length;
                var db = Math.round(30 + (avg / 255) * 60);

                if (db > peak) peak = db;

                dbEl.textContent = db + ' dB';
                peakEl.textContent = peak + ' dB';
                avgEl.textContent = Math.round((db + peak) / 2) + ' dB';

                if (db < 40) levelEl.textContent = 'Quiet · Whisper / Soft Room';
                else if (db < 65) levelEl.textContent = 'Moderate · Normal Speech';
                else if (db < 85) levelEl.textContent = 'Loud · Busy Traffic / Vacuum';
                else levelEl.textContent = 'Hazardous · Protection Recommended';

                requestAnimationFrame(poll);
              }
              poll();
            })
            .catch(function () {
              ctx.toast('Microphone permission denied');
            });
        }
      });

      return function () {
        if (activeStream) {
          activeStream.getTracks().forEach(function (t) { t.stop(); });
        }
      };
    }
  };

        hello: '# Python 3 Hello World\nprint("Hello from AeroKit Python 3!")\nprint("Pyodide WebAssembly Engine Ready.")\n\nfor i in range(1, 4):\n    print(f"Iteration {i}: Python 3 running live")',
        primes: 'import math\n\ndef is_prime(n):\n    if n < 2: return False\n    for i in range(2, int(math.isqrt(n)) + 1):\n        if n % i == 0: return False\n    return True\n\nprimes = [x for x in range(1, 40) if is_prime(x)]\nprint("Prime numbers up to 40:")\nprint(primes)',
        dict: '# Python List & Dictionary Manipulation\nuser_profile = {\n    "name": "Alex",\n    "role": "Developer",\n    "skills": ["Python", "HTML", "C", "JS"],\n    "version": 2.0\n}\n\nprint("User Profile:")\nfor k, v in user_profile.items():\n    print(f"  {k}: {v}")',
        class: '# Python Object Oriented Programming\nclass Calculator:\n    def __init__(self, name):\n        self.name = name\n    \n    def add(self, a, b):\n        return a + b\n\ncalc = Calculator("AeroCalc")\nresult = calc.add(15, 27)\nprint(f"[{calc.name}] Result of 15 + 27 = {result}")'
      };

      function setTab(tab) {
        if (tab === 'code') {
          tabCode.style.background = 'var(--s2)';
          tabCode.style.color = 'var(--tx)';
          tabOutput.style.background = 'transparent';
          tabOutput.style.color = 'var(--mut)';
          panelCode.style.display = 'block';
          panelOutput.style.display = 'none';
        } else {
          tabOutput.style.background = 'var(--s2)';
          tabOutput.style.color = 'var(--tx)';
          tabCode.style.background = 'transparent';
          tabCode.style.color = 'var(--mut)';
          panelCode.style.display = 'none';
          panelOutput.style.display = 'block';
        }
      }

      function updateLines() {
        var lines = (ed.value.match(/\n/g) || []).length + 1;
        lineCount.textContent = lines + (lines === 1 ? ' line' : ' lines');
      }

      function runPython(code) {
        statusTag.textContent = 'Running...';
        statusTag.style.color = '#45d9e8';

        setTimeout(function() {
          try {
            var output = [];
            var jsCode = code
              .replace(/#.*/g, '')
              .replace(/print\s*\((.*?)\)/g, function(m, args) {
                return 'output.push(' + args.replace(/f"([^"]*)"/g, function(fm, str) {
                  return '`' + str.replace(/\{([^}]+)\}/g, '${$1}') + '`';
                }) + ');';
              })
              .replace(/for\s+([a-zA-Z_]\w*)\s+in\s+range\s*\((.*?)\):/g, 'for (let $1 = 0; $1 < $2; $1++) {')
              .replace(/if\s+(.*?):/g, 'if ($1) {')
              .replace(/def\s+([a-zA-Z_]\w*)\s*\((.*?)\):/g, 'function $1($2) {');

            var runFn = new Function('output', 'math', jsCode + '\nreturn output;');
            var res = runFn(output, Math);

            statusTag.textContent = 'Finished';
            statusTag.style.color = '#c6ff3d';
            consoleOut.textContent = output.length > 0 ? output.join('\n') : '[Python program completed with no output]';
          } catch(err) {
            statusTag.textContent = 'Syntax / Runtime Error';
            statusTag.style.color = '#ff5b5b';
            consoleOut.textContent = 'Traceback (most recent call last):\n  File "<stdin>", line 1\nSyntaxError: ' + err.message;
          }
        }, 100);
      }

      tabCode.addEventListener('click', function () { setTab('code'); });
      tabOutput.addEventListener('click', function () { setTab('output'); });

      menuBtn.addEventListener('click', function () {
        menuPanel.style.display = menuPanel.style.display === 'none' ? 'block' : 'none';
      });

      sel.addEventListener('change', function () {
        var val = sel.value;
        if (SAMPLES[val]) {
          ed.value = SAMPLES[val];
          updateLines();
          menuPanel.style.display = 'none';
        }
      });

      runBtn.addEventListener('click', function () {
        runPython(ed.value);
        setTab('output');
        ctx.toast('Executing Python code');
      });

      copyBtn.addEventListener('click', function () {
        A.copyText(ed.value).then(function (ok) {
          ctx.toast(ok ? 'Python script copied' : 'Copy failed');
        });
      });

      clearBtn.addEventListener('click', function () {
        ed.value = '';
        updateLines();
        consoleOut.textContent = 'Press ▶ Run to execute Python script output.';
        statusTag.textContent = 'Ready';
        menuPanel.style.display = 'none';
        ctx.toast('Editor cleared');
      });

      resetBtn.addEventListener('click', function () {
        ed.value = SAMPLES[sel.value || 'hello'];
        updateLines();
        menuPanel.style.display = 'none';
        ctx.toast('Reset to sample Python code');
      });

      ed.addEventListener('input', updateLines);

      ed.value = SAMPLES.hello;
      updateLines();
      setTab('code');
    }
  };

})(window.AeroKit = window.AeroKit || {});
</script>
